<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Código de Ética del Militante Mepista - Movimiento Electoral del Pueblo (MEP)">
<meta name="theme-color" content="#1a0b2e">
<title>Código de Ética del Militante Mepista | MEP</title>
<style>
  :root{
    --purple-dark:#1a0b2e;
    --purple-mid:#330b69;
    --purple-light:#51139e;
    --yellow:#fcd116;
    --yellow-hover:#ffd700;
    --text-main:#f8f6fc;
    --text-dim:#c8bce0;
    --card-bg:rgba(81,19,158,.28);
    --card-border:rgba(252,209,22,.18);
    --glass:rgba(51,11,105,.55);
    --header-bg:rgba(26,11,46,.92);
    --shadow:0 10px 40px rgba(0,0,0,.5);
    --fs:16px;
    --radius:16px;
  }

  html[data-theme="light"]{
    --purple-dark:#f3eefb;
    --purple-mid:#e7dcf7;
    --purple-light:#d8c7f0;
    --text-main:#24104a;
    --text-dim:#5c4a80;
    --card-bg:rgba(255,255,255,.75);
    --card-border:rgba(81,19,158,.18);
    --glass:rgba(255,255,255,.65);
    --header-bg:rgba(255,255,255,.92);
    --shadow:0 10px 30px rgba(81,19,158,.18);
  }

  *{box-sizing:border-box;}

  html{scroll-behavior:smooth;scroll-padding-top:140px;}

  body{
    font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
    background:linear-gradient(135deg,var(--purple-dark) 0%,var(--purple-mid) 55%,var(--purple-dark) 100%);
    background-attachment:fixed;
    color:var(--text-main);
    margin:0;
    padding:0;
    min-height:100vh;
    font-size:var(--fs);
    transition:background .4s ease,color .4s ease;
  }

  /* ===== Barra de progreso ===== */
  #progressBar{
    position:fixed;top:0;left:0;height:4px;width:0%;
    background:linear-gradient(90deg,var(--yellow),#fff3a8);
    z-index:300;transition:width .1s linear;
  }

  /* ===== Encabezado ===== */
  header{
    background:var(--header-bg);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    padding:18px 16px 14px;
    text-align:center;
    border-bottom:4px solid var(--yellow);
    position:sticky;top:0;z-index:200;
    box-shadow:0 4px 24px rgba(0,0,0,.45);
  }
  header h1{
    color:var(--yellow);margin:0 0 4px;
    font-size:clamp(1.05rem,3.4vw,1.6rem);
    text-transform:uppercase;letter-spacing:1.2px;
    text-shadow:0 2px 12px rgba(252,209,22,.3);
  }
  html[data-theme="light"] header h1{color:var(--purple-mid);text-shadow:none;}
  header .sub{color:var(--text-dim);font-size:.8rem;margin:0 0 12px;letter-spacing:.5px;}

  .toolbar{
    display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;
  }

  .btn{
    display:inline-flex;align-items:center;gap:7px;
    border:1px solid var(--card-border);
    background:rgba(252,209,22,.12);
    color:var(--text-main);
    padding:8px 14px;border-radius:25px;
    font-size:.82rem;font-weight:600;cursor:pointer;
    text-decoration:none;transition:all .25s ease;
  }
  .btn:hover,.btn:focus-visible{
    background:var(--yellow);color:var(--purple-dark);
    transform:translateY(-2px);
    box-shadow:0 6px 18px rgba(252,209,22,.35);
    outline:none;
  }
  .btn-primary{
    background:var(--yellow);color:#1a0b2e;border-color:var(--yellow);
    box-shadow:0 4px 14px rgba(252,209,22,.28);
  }
  .btn-primary:hover{background:var(--yellow-hover);}

  /* ===== Buscador ===== */
  .search-wrap{position:relative;flex:1 1 230px;max-width:330px;}
  #search{
    width:100%;padding:9px 34px 9px 36px;border-radius:25px;
    border:1px solid var(--card-border);
    background:rgba(0,0,0,.22);color:var(--text-main);
    font-size:.85rem;outline:none;transition:.25s;
  }
  html[data-theme="light"] #search{background:rgba(255,255,255,.8);}
  #search:focus{border-color:var(--yellow);box-shadow:0 0 0 3px rgba(252,209,22,.22);}
  #search::placeholder{color:var(--text-dim);}
  .search-ico{position:absolute;left:13px;top:50%;transform:translateY(-50%);opacity:.7;font-size:.9rem;}
  #clearSearch{
    position:absolute;right:10px;top:50%;transform:translateY(-50%);
    background:none;border:none;color:var(--text-dim);cursor:pointer;
    font-size:1rem;display:none;line-height:1;
  }

  /* ===== Panel de estado ===== */
  .status-bar{
    max-width:880px;margin:18px auto 0;padding:0 16px;
    display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;
    font-size:.8rem;color:var(--text-dim);
  }
  .chip{
    background:var(--glass);border:1px solid var(--card-border);
    padding:6px 14px;border-radius:20px;
  }
  .chip b{color:var(--yellow);}
  html[data-theme="light"] .chip b{color:var(--purple-light);}

  /* ===== Contenedor ===== */
  .container{
    max-width:880px;margin:18px auto 60px;padding:30px;
    background:var(--glass);
    border:1px solid var(--card-border);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
  }

  .intro{
    font-style:italic;color:var(--text-main);
    margin:0 0 30px;border-left:4px solid var(--yellow);
    padding:16px 20px;background:rgba(0,0,0,.18);
    border-radius:0 10px 10px 0;line-height:1.75;font-size:.97rem;
  }
  html[data-theme="light"] .intro{background:rgba(81,19,158,.07);}

  /* ===== Lista de normas ===== */
  ol.normas{list-style:none;padding:0;margin:0;counter-reset:n;}

  li.norma{
    position:relative;
    display:grid;
    grid-template-columns:46px 1fr;
    gap:14px;
    margin-bottom:16px;
    padding:18px 16px 18px 14px;
    background:var(--card-bg);
    border:1px solid transparent;
    border-left:3px solid rgba(252,209,22,.35);
    border-radius:12px;
    line-height:1.68;
    opacity:0;transform:translateY(18px);
    transition:opacity .5s ease,transform .5s ease,background .25s,border-color .25s,box-shadow .25s;
  }
  li.norma.visible{opacity:1;transform:none;}
  li.norma:hover{
    background:rgba(81,19,158,.45);
    border-color:var(--card-border);
    border-left-color:var(--yellow);
    box-shadow:0 8px 24px rgba(0,0,0,.3);
  }
  html[data-theme="light"] li.norma:hover{background:rgba(255,255,255,.95);box-shadow:0 8px 20px rgba(81,19,158,.15);}
  li.norma:target{border-color:var(--yellow);box-shadow:0 0 0 2px rgba(252,209,22,.35);}
  li.norma.leida{border-left-color:#4ade80;}
  li.norma.leida .num{background:#4ade80;}
  li.norma.oculta{display:none;}

  .num{
    grid-row:1 / span 2;
    width:36px;height:36px;border-radius:50%;
    background:var(--yellow);color:#1a

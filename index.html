async function verPlanillaDetalle(estado, municipio, ci){
  const rows = await Api.listRecords({ estado, municipio });
  const r = rows.find(x => normCI(x.ci) === normCI(ci));
  if(!r) return err('Planilla no encontrada.');
  const imgSrc = safeImgSrc(r.foto || '');
  const row = (k, v) => v ? '<div class="k">' + esc(k) + '</div><div class="v">' + esc(v) + '</div>' : '';
  const est = r.aprobacion || APROBACION.PENDIENTE;
  const canApprove = Permissions.canApprove(state.user) && est === APROBACION.PENDIENTE;
  const aprobBox =
    '<div class="aprob-box ' + est + '">' +
      '<div class="flex sp" style="gap:12px;flex-wrap:wrap">' +
        '<b style="color:var(--accent);text-transform:uppercase;font-size:11.5px;letter-spacing:0.8px">Estado de Aprobación</b>' + aprobBadge(est) +
      '</div>' +
      (r.aprobado_por_nombre ? '<div class="aprob-meta">Aprobado/Revisado por: <b>' + esc(r.aprobado_por_nombre) + '</b></div>' : '') +
      (r.aprobado_en ? '<div class="aprob-meta">Fecha: <b>' + fmtDate(r.aprobado_en) + '</b></div>' : '') +
      (r.rechazado_motivo ? '<div class="aprob-meta">Motivo: <b>' + esc(r.rechazado_motivo) + '</b></div>' : '') +
      (canApprove ? '<div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap">' +
        '<button class="btn ok" data-action="aprobarRegistro" data-id="' + esc(r.id) + '">✓ Aprobar</button>' +
        '<button class="btn danger" data-action="rechazarRegistro" data-id="' + esc(r.id) + '">✕ Rechazar</button>' +
      '</div>' : '') +
    '</div>';

  UI.modal('<div class="flex sp" style="flex-wrap:wrap;gap:16px;align-items:flex-start">' +
      '<div><h2 style="margin-bottom:6px">' + esc(r.nombre) + '</h2>' +
      '<p class="small">Planilla N° <b style="color:var(--accent)">' + esc(r.numero||'') + '</b> · ' + esc(r.tipo_original||r.tipo) + ' · ' + fmtDate(r.created) + '</p></div>' +
      (imgSrc ? '<img src="' + esc(imgSrc) + '" class="detail-photo" alt="">' : '') +
    '</div>' +
    aprobBox +
    '<div class="detail-grid">' +
      row('C.I.', r.ci) + row('Sexo', r.sexo) + row('Lugar de Nacimiento', r.lugar_nac) +
      row('Fecha de Nacimiento', r.fecha_nac) + row('Estado Civil', r.estado_civil) + row('Profesión', r.profesion) +
      row('Oficio', r.oficio) + row('Estado', r.estado) + row('Municipio', r.municipio) + row('Parroquia', r.parroquia) +
      row('Sector', r.sector) + row('Residencia', r.residencia) + row('Punto de referencia', r.punto_ref) +
      row('Teléfono', r.telefono) + row('E-mail', r.email) + row('Trabajo', r.trabajo) +
      row('Empresa', r.empresa) + row('Nivel de Instrucción', r.nivel_inst) + row('Área', r.area) +
      row('Especialización', r.especializacion) + row('Sector donde activa', r.sector_activa) +
      row('Centro de votación', r.centro_vot) + row('Código', r.codigo) + row('Mesa', r.mesa) +
    '</div>' +
    '<div class="section flex sp" style="justify-content:flex-end;margin-top:16px">' +
      '<button class="btn ok" data-action="imprimirPlanillaIndividual" data-estado="' + esc(estado) + '" data-municipio="' + esc(municipio) + '" data-ci="' + esc(r.ci) + '">🖨️ Imprimir Planilla</button>' +

function reglamentoContenidoHTML(){
  let html = '<div class="reglamento-doc">';
  html += '<div class="rm-header">' +
    '<div class="rm-logo">MEP</div>' +
    '<div class="rm-partido">' + esc(REGLAMENTO_MEP.partido) + '</div>' +
    '<h2>' + esc(REGLAMENTO_MEP.titulo) + '</h2>' +
    '<p class="rm-fecha">' + esc(REGLAMENTO_MEP.aprobacion) + '</p>' +
    '</div>';
  REGLAMENTO_MEP.capitulos.forEach(cap => {
    html += '<div class="rm-cap"><h3>' + esc(cap.titulo) + '</h3>';
    cap.articulos.forEach(art => {
      html += '<div class="rm-art">' +
        '<p class="rm-art-num">Artículo ' + art.n + '.-</p>' +
        '<p class="rm-art-txt">' + esc(art.texto) + '</p>';
      if(art.lista){
        html += '<div class="rm-lista">' + art.lista.map(item => '<p>' + esc(item) + '</p>').join('') + '</div>';
      }
      if(art.parrafo){
        html += '<p class="rm-parrafo">' + esc(art.parrafo) + '</p>';
      }
      html += '</div>';
    });
    html += '</div>';
  });
  html += '<div class="rm-footer">' + esc(REGLAMENTO_MEP.lugar) + '</div>';
  html += '</div>';
  return html;
}

function leerReglamento(){
  UI.modal(

      '<button class="btn sec" style="padding:6px 14px;font-size:12px" data-action="closeModal">✕ Cerrar</button>' +

      '<button class="btn ok" data-action="imprimirReglamento">🖨️ Imprimir</button>' +
      '<button class="btn sec" data-action="closeModal">Cerrar</button>' +
    '</div>'
  );
}

function imprimirReglamento(){
  const html = '<div style="font-family:Georgia,\'Times New Roman\',serif;color:#000;line-height:1.6">' +
    reglamentoContenidoHTML() +
  '</div>';
  document.getElementById('printArea').innerHTML = html;
  window.print();
}

function abrirPDFReglamento(){
  const w = window.open(CONFIG.PDF_REGLAMENTO, '_blank');
  if(!w) info('El navegador bloqueó la apertura automática. Permitir pop-ups.');
  else info('Abriendo documento PDF.');
}

function irAArticulo(capIdx){
  leerReglamento();
  setTimeout(() => {

  else if(tab === 'pendientes' && Permissions.isMaster(actor)){ filtered = pendientes; btnLabel = ''; }
  else { filtered = operativos; btnLabel = 'Agregar CPR / CPM'; btnAs = Roles.CPR; }

  const rows = filtered.map(u => {
    const canManage = Permissions.canManageUser(actor, u);
    const canToggle = Permissions.canToggleAprobador(actor, u);
    const imgSrc = safeImgSrc(u.foto || '');
    
    let actions = '';
    if(tab === 'pendientes'){
      actions = '<button class="btn ok" style="padding:6px 10px;font-size:11.5px" data-action="aprobarUsuario" data-id="' + esc(u.id) + '">✓ Aprobar</button> ' +
                '<button class="btn danger" style="padding:6px 10px;font-size:11.5px" data-action="eliminarUsuario" data-id="' + esc(u.id) + '">✕ Rechazar</button>';
    } else if(canManage){

                '<button class="btn danger" style="padding:6px 10px;font-size:11.5px" data-action="eliminarUsuario" data-id="' + esc(u.id) + '">Eliminar</button>';
    } else {
      actions = '<span class="small">—</span>';
    }
    
    if(canToggle && tab !== 'pendientes'){
      actions = '<button class="btn ' + (u.es_aprobador ? 'ok' : 'sec') + '" style="padding:6px 10px;font-size:11.5px" data-action="toggleAprobador" data-id="' + esc(u.id) + '" data-value="' + (u.es_aprobador ? '0' : '1') + '">' +
        (u.es_aprobador ? '✓ Aprobador' : 'Designar Aprobador') + '</button> ' + actions;
    }
    
    return '<tr><td>' + (imgSrc ? '<img src="' + esc(imgSrc) + '" style="width:34px;height:34px;border-radius:50%;object-fit:cover;border:2px solid var(--accent)" alt="">' : '<span class="small">—</span>') + '</td>' +
      '<td>' + esc(u.nombre) + ' ' + esc(u.apellido) + '</td><td>' + esc(u.ci) + '</td><td>' + esc(u.telefono) + '</td>' +

      '<td>' + esc(u.estado || '') + (u.municipio ? ' / ' + esc(u.municipio) : '') + '</td>' +
      '<td>' + actions + '</td></tr>';

  const masterBlock = Permissions.isMaster(actor) && masters.length
    ? '<div class="section"><h3 style="margin-bottom:8px">Cuenta Master</h3><div class="table-responsive"><table><thead><tr><th>Foto</th><th>Nombre</th><th>CI</th><th>Teléfono</th><th>Rol</th><th>Ubicación</th><th>Acciones</th></tr></thead><tbody>' +

        const imgSrc = safeImgSrc(u.foto || '');

          '<td><span class="badge master">' + esc(u.rol) + '</span></td><td>—</td><td><span class="small">—</span></td></tr>';
      }).join('') + '</tbody></table></div></div>' : '';

    ? '<div class="tabs section">' +

    (tab === 'pendientes' ? '<div class="readonly-banner" style="margin-top:14px;border-left-color:#ffc107">⚠️ Los usuarios en esta lista se han registrado pero <b>no pueden iniciar sesión</b> hasta que los apruebes.</div>' : '') +

    '<tbody>' + (rows || '<tr><td colspan="7">Sin usuarios registrados en esta categoría.</td></tr>') + '</tbody></table></div>' + masterBlock + '</div>';
}

function abrirRegistro(asRol){
  const allowed = Permissions.creatableRoles(state.user);
  if(!allowed.length) return err('No tenés permisos para crear usuarios.');
  if(asRol && !allowed.includes(asRol)) return err('No autorizado para este rol.');
  state.registerRole = asRol || allowed[0];
  state.view = 'register';
  render();
}
function setUserTab(tab){
  if(tab === 'nacionales' && !Permissions.canSeeNacionalesTab(state.user)) return err('No autorizado.');
  if(tab === 'pendientes' && !Permissions.isMaster(state.user)) return err('No autorizado.');
  state.userTab = tab;
  renderTabContent();
}
async function cambiarPw(id){
  const target = (await Api.listUsers()).find(u => u.id === id);
  if(!target) return err('Usuario no encontrado.');
  if(!Permissions.canManageUser(state.user, target)) return err('No tenés permisos.');
  const pw = prompt('Nueva contraseña para ' + target.nombre + ' ' + target.apellido + ' (mínimo 8 caracteres):');
  if(!pw) return;
  if(pw.length < 8) return err('La contraseña debe tener al menos 8 caracteres.');
  try{ await Api.changePassword(state.user, id, pw); ok('Contraseña actualizada con éxito.'); }
  catch(e){ err(e.message); }
}
async function eliminarUsuario(id){
  const target = (await Api.listUsers()).find(u => u.id === id);
  if(!target) return err('Usuario no encontrado.');
  if(!Permissions.canManageUser(state.user, target) && state.userTab !== 'pendientes') return err('No tenés permisos.');
  if(!confirm('¿Confirma eliminar al usuario ' + target.nombre + ' ' + target.apellido + '?')) return;
  try{ await Api.deleteUser(state.user, id); ok('Usuario eliminado.'); renderTabContent(); }
  catch(e){ err(e.message); }
}
async function toggleAprobador(id, value){
  const target = (await Api.listUsers()).find(u => u.id === id);
  if(!target) return err('Usuario no encontrado.');
  if(!Permissions.canToggleAprobador(state.user, target)) return err('No autorizado.');
  try{
    await Api.toggleAprobador(state.user, id, !!value);
    ok(value ? 'Usuario designado como aprobador.' : 'Designación de aprobador removida.');
    renderTabContent();
  }catch(e){ err(e.message); }
}
async function aprobarUsuario(id){
  if(!Permissions.isMaster(state.user)) return err('No autorizado.');
  try{
    await Api.aprobarUsuario(state.user, id);
    ok('Usuario aprobado. Ya puede iniciar sesión.');
    renderTabContent();
  }catch(e){ err(e.message); }
}

let newLogoData = null;
function abrirCambioLogo(){
  if(!Permissions.isMaster(state.user)) return err('Solo el Master puede cambiar el logo.');
  newLogoData = null;
  const current = DB.get('custom_logo', null) || CONFIG.LOGO_SRC;
  UI.modal(
    '<h2>Cambiar Logo de la Aplicación</h2>' +
    '<p class="small" style="margin-top:6px">Sube una imagen para reemplazar el logo en toda la app.</p>' +
    '<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:16px">' +
      '<div style="width:220px;height:160px;border:2px dashed var(--border-light);border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:rgba(20,7,32,0.6);flex-shrink:0">' +
        '<img id="logoPreviewImg" src="' + esc(current) + '" style="max-width:100%;max-height:100%;object-fit:contain" alt="">' +
      '</div>' +
      '<div style="flex:1;min-width:220px;display:flex;flex-direction:column;gap:10px">' +
        '<button class="btn" data-action="triggerLogoFile">📁 Seleccionar Imagen</button>' +
        '<button class="btn ok" data-action="guardarLogo" id="logoGuardarBtn" disabled>💾 Guardar Logo</button>' +
        '<div class="photo-hint">Recomendado: PNG/JPG horizontal, máx. 800px de ancho.</div>' +
      '</div>' +
    '</div>' +
    '<input type="file" accept="image/*" id="logoFileInput" style="display:none">' +
    '<div style="margin-top:20px;display:flex;gap:10px;justify-content:flex-end">' +
      '<button class="btn sec" data-action="closeModal">Cancelar</button>' +
    '</div>'
  );
  const input = document.getElementById('logoFileInput');
  if(input) input.addEventListener('change', handleLogoFile);
}

async function handleLogoFile(e){
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  if(!/^image\//.test(file.type)){ err('El archivo no es una imagen.'); e.target.value=''; return; }
  if(file.size > 5 * 1024 * 1024){ err('Imagen demasiado grande (máx 5 MB).'); e.target.value=''; return; }
  try{
    const dataUrl = await compressImage(file, 800, 0.85);
    newLogoData = dataUrl;
    const img = document.getElementById('logoPreviewImg');
    if(img) img.src = dataUrl;
    const btn = document.getElementById('logoGuardarBtn');
    if(btn) btn.disabled = false;
    ok('Imagen lista. Pulse "Guardar Logo".');
  }catch(ex){ err('Error al procesar la imagen.'); }
  e.target.value = '';
}

function guardarLogo(){
  if(!Permissions.isMaster(state.user)) return err('Solo el Master puede cambiar el logo.');
  if(!newLogoData) return err('Seleccione una imagen primero.');
  try{
    DB.set('custom_logo', newLogoData);
    newLogoData = null;
    UI.closeModal();
    ok('✅ Logo actualizado correctamente.');
    setTimeout(() => render(), 400);
  }catch(ex){
    err('No se pudo guardar. Intente con una imagen más pequeña.');
  }
}

function resetLogo(){
  if(!Permissions.isMaster(state.user)) return err('Solo el Master puede cambiar el logo.');
  if(!confirm('¿Restaurar el logo original de la aplicación?')) return;
  DB.remove('custom_logo');
  ok('Logo restaurado al original.');
  render();
}

  imprimirReglamento(){ imprimirReglamento(); },
  abrirPDFReglamento(){ abrirPDFReglamento(); },
  irAArticulo(el){ irAArticulo(el.dataset.cap); },
  abrirRegistro(el){ abrirRegistro(el.dataset.as); },
  setUserTab(el){ setUserTab(el.dataset.tab); },
  cambiarPw(el){ cambiarPw(el.dataset.id); },
  eliminarUsuario(el){ eliminarUsuario(el.dataset.id); },
  toggleAprobador(el){ toggleAprobador(el.dataset.id, el.dataset.value === '1'); },
  aprobarUsuario(el){ aprobarUsuario(el.dataset.id); },
  setHistFiltro(el){ setHistFiltro(el.dataset.filtro); },
  setApprovalFilter(el){ setApprovalFilter(el.dataset.filtro); },
  aprobarRegistro(el){ aprobarRegistro(el.dataset.id); },
  rechazarRegistro(el){ rechazarRegistro(el.dataset.id); },
  confirmarRechazo(el){ confirmarRechazo(el.dataset.id); },
  abrirCambioLogo(){ abrirCambioLogo(); },
  triggerLogoFile(){ const i = document.getElementById('logoFileInput'); if(i) i.click(); },
  guardarLogo(){ guardarLogo(); },
  resetLogo(){ resetLogo(); },
  closeModal(){ UI.closeModal(); }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const fn = Actions[el.dataset.action];
  if(typeof fn !== 'function') return;
  e.preventDefault();
  fn(el, e);
});

document.addEventListener('change', e => {
  const t = e.target;
  if(t.id && t.id.startsWith('cam_')){ handlePhotoInput(t, t.id.slice(4)); return; }
  if(t.id && t.id.startsWith('file_')){ handlePhotoInput(t, t.id.slice(5)); return; }
  if(t.id === 'ap_estado'){
    state.approvalEstado = t.value;
    state.approvalMunicipio = '';
    renderTabContent();
    return;
  }
  if(t.id === 'ap_muni'){
    state.approvalMunicipio = t.value;
    renderTabContent();
    return;
  }
  const el = t.closest && t.closest('[data-change]');
  if(!el) return;
  if(el.dataset.change === 'rolChange') onRolChange();
  else if(el.dataset.change === 'estadoMunicipio') onEstadoMunicipioChange(el.dataset.source || el.id);
  else if(el.dataset.change === 'mepPreview') updateMepPreview(t.id.replace('f_muni_',''));
});

/* ============================================================
   DO LOGIN
============================================================ */
async function doLogin(){
  if(state.busy) return;
  const ciEl = document.getElementById('li_ci');
  const pwEl = document.getElementById('li_pw');
  if(!ciEl || !pwEl) return;
  const ci = ciEl.value.trim();
  const pw = pwEl.value;
  if(!ci || !pw) return err('Complete todos los campos.');
  if(!isValidCI(ci)) return err('Cédula inválida (5 a 9 dígitos).');
  state.busy = true;
  let loginOk = false;
  try{
    state.user = await Api.login(ci, pw);
    state.view = 'dashboard';
    state.tab = (state.user.rol === Roles.CPR || state.user.rol === Roles.CPM) ? 'cargar' : 'inicio';
    state.batchCount = 0; state.batchTipo = null; state.userTab = 'operativos';
    state.approvalFilter = 'pendiente'; state.approvalEstado = ''; state.approvalMunicipio = '';
    loginOk = true;
    ok('Bienvenido, ' + state.user.nombre);
  }catch(e){ err(e.message || 'Credenciales incorrectas.'); }
  finally{ state.busy = false; }
  if(loginOk) render();
}

/* ============================================================
   INIT
============================================================ */
(async function init(){
  try{
    // Nota: ensureBootstrapMaster ha sido deshabilitado. Los Master se crean desde el panel de PocketBase.
    await Api.history.purge();
    const stored = DB.get('session', null);
    if(stored && stored.id){
      const u = await Api.validateSession(stored);
      if(u){
        state.user = u;
        state.view = 'dashboard';
        state.tab = (u.rol === Roles.CPR || u.rol === Roles.CPM) ? 'cargar' : 'inicio';
      } else { DB.remove('session'); }
    }
  }catch(e){ console.warn('init', e); }
  render();
})();

/* Aviso al salir con lote a medias */
window.addEventListener('beforeunload', e => {
  if(state.batchCount > 0){
    e.preventDefault();
    e.returnValue = '';
    return '';
  }
});
</script>

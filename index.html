<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>CNE MEP — Sistema Electoral</title>
<style>
:root{
  --primary:#6c0fa3;--primary-hover:#550a7c;--primary-light:#922bd9;--primary-dark:#3b035f;--primary-soft:rgba(108,15,163,0.18);
  --accent:#ffe600;--accent-hover:#e6cf00;--accent-soft:rgba(255,230,0,0.12);--accent-text:#14051d;
  --bg-dark:#0a0310;--bg-grad-1:#12051c;--bg-grad-2:#1e0a2e;
  --glass-bg:rgba(28, 12, 45, 0.72);--glass-border:rgba(255, 255, 255, 0.08);--glass-shine:rgba(255, 255, 255, 0.04);
  --surface:#1c0d29;--surface-2:#140720;--surface-3:#29143d;--surface-hover:#341a4d;
  --border:#3a1d59;--border-light:#4f2979;--border-strong:rgba(255,230,0,0.35);
  --text:#fcfaff;--text-dim:#c2b1d9;--text-muted:#8d77aa;
  --danger:#ff4d4d;--danger-hover:#e63939;--ok:#00e676;
  --radius:18px;--radius-sm:12px;--radius-xs:8px;
  --shadow-sm:0 4px 20px rgba(0,0,0,0.25);--shadow:0 8px 32px rgba(0,0,0,0.45);
  --shadow-lg:0 20px 60px rgba(0,0,0,0.65);--shadow-accent:0 0 0 4px rgba(255,230,0,0.25);
  --t-fast:0.2s cubic-bezier(0.16, 1, 0.3, 1);--t:0.35s cubic-bezier(0.16, 1, 0.3, 1);
}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Inter',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow-x:hidden}
body{
  background:
    radial-gradient(circle at 10% 10%, rgba(108,15,163,0.4) 0%, transparent 50%),
    radial-gradient(circle at 90% 90%, rgba(255,230,0,0.06) 0%, transparent 60%),
    linear-gradient(135deg, var(--bg-grad-1) 0%, var(--bg-grad-2) 100%);
  background-attachment:fixed;color:var(--text);min-height:100vh;font-size:14.5px;line-height:1.6;
}
.hidden{display:none!important}

@keyframes fadeInUp{from{opacity:0;transform:translateY(24px) scale(0.98)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes scaleIn{from{opacity:0;transform:scale(0.92)}to{opacity:1;transform:scale(1)}}

.card{
  background:var(--glass-bg);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-radius:var(--radius);padding:24px;border:1px solid var(--glass-border);
  box-shadow:var(--shadow);transition:all var(--t);position:relative;overflow:hidden;
  animation:fadeInUp 0.5s cubic-bezier(0.16,1,0.3,1) both;
}
.card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--glass-shine),transparent);
}
.card:hover{border-color:var(--border-light);box-shadow:var(--shadow-lg);transform:translateY(-2px)}

.btn{
  background:linear-gradient(135deg,var(--primary-light) 0%,var(--primary) 100%);color:#fff;border:none;
  padding:13px 22px;border-radius:var(--radius-sm);cursor:pointer;font-size:14px;font-weight:700;
  letter-spacing:0.3px;transition:all var(--t);box-shadow:0 4px 16px rgba(108,15,163,0.45),inset 0 1px 0 rgba(255,255,255,0.2);
  display:inline-flex;align-items:center;justify-content:center;gap:8px;position:relative;overflow:hidden;
}
.btn::after{content:'';position:absolute;inset:0;background:linear-gradient(rgba(255,255,255,0.12),transparent);opacity:0;transition:opacity var(--t-fast)}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 22px rgba(108,15,163,0.65),inset 0 1px 0 rgba(255,255,255,0.3)}
.btn:hover::after{opacity:1}
.btn:active{transform:translateY(0)}
.btn:focus-visible{outline:none;box-shadow:var(--shadow-accent)}
.btn:disabled{opacity:0.5;cursor:not-allowed;transform:none!important;box-shadow:none}

.btn.sec{
  background:rgba(41,20,61,0.7);color:var(--text);border:1px solid var(--border);
  box-shadow:0 4px 14px rgba(0,0,0,0.3);backdrop-filter:blur(8px);
}
.btn.sec:hover{background:var(--surface-hover);border-color:var(--primary-light);color:var(--accent)}

.btn.ok{
  background:linear-gradient(135deg,var(--accent) 0%,#d9c200 100%);color:var(--accent-text);
  box-shadow:0 4px 20px rgba(255,230,0,0.35),inset 0 1px 0 rgba(255,255,255,0.5);font-weight:800;
}
.btn.ok:hover{background:linear-gradient(135deg,#ffe933 0%,#c7b200 100%);box-shadow:0 6px 25px rgba(255,230,0,0.55)}

.btn.danger{
  background:linear-gradient(135deg,#ff6b6b 0%,var(--danger) 100%);box-shadow:0 4px 16px rgba(255,77,77,0.35);
}
.btn.danger:hover{background:linear-gradient(135deg,#ff5252 0%,var(--danger-hover) 100%)}

input,select,textarea{
  width:100%;padding:13px 16px;border-radius:var(--radius-sm);border:1px solid var(--border);
  background:rgba(20,7,32,0.85);color:var(--text);font-size:15px;margin-top:6px;
  transition:all var(--t);font-family:inherit;backdrop-filter:blur(6px);
}
input::placeholder,textarea::placeholder{color:var(--text-muted)}
input:hover,select:hover,textarea:hover{border-color:var(--border-light)}
input:focus,select:focus,textarea:focus{
  outline:none;border-color:var(--accent);background:rgba(35,14,56,0.95);
  box-shadow:var(--shadow-accent);transform:translateY(-1px);
}
input:disabled,select:disabled{opacity:0.6;cursor:not-allowed}

select{
  cursor:pointer;appearance:none;
  background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%23ffe600' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='6 9 12 15 18 9'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 14px center;padding-right:42px;
}
select option{background:var(--surface);color:var(--text);padding:10px}
label{font-size:12.5px;color:var(--text-dim);display:block;margin-top:16px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase}
label .hint{text-transform:none;font-weight:400;letter-spacing:0;color:var(--text-muted);font-size:11.5px}

h1,h2,h3{color:var(--accent);font-weight:800;letter-spacing:-0.5px}
h1{text-align:center;font-size:28px;margin-bottom:6px}
h2{font-size:20px;margin-bottom:8px;position:relative;padding-bottom:10px}
h2::after{
  content:'';position:absolute;bottom:0;left:0;width:56px;height:3px;
  background:linear-gradient(90deg,var(--accent) 0%,var(--primary) 100%);border-radius:2px;
}
h3{font-size:16px}
h4.section-title{
  font-size:12.5px;color:var(--accent);text-transform:uppercase;letter-spacing:1.2px;
  margin:24px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--border-light);font-weight:800;
}
.sub{text-align:center;color:var(--text-dim);font-size:13.5px;margin-bottom:24px;letter-spacing:0.3px}
.small{font-size:12px;color:var(--text-dim);letter-spacing:0.2px}
.tot{font-weight:800;color:var(--accent);font-size:18px;letter-spacing:-0.2px}
.link{color:var(--accent);cursor:pointer;font-size:13.5px;font-weight:600;transition:all var(--t)}
.link:hover{color:#fff;text-shadow:0 0 12px rgba(255,230,0,0.6)}

.tabs{
  display:flex;gap:8px;overflow-x:auto;padding:8px;background:rgba(20,7,32,0.85);
  backdrop-filter:blur(12px);border-radius:var(--radius-sm);border:1px solid var(--border);
  width:100%;max-width:100%;margin-bottom:24px;scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  background:transparent;padding:10px 18px;border-radius:var(--radius-xs);cursor:pointer;
  font-size:13px;font-weight:700;color:var(--text-dim);transition:all var(--t);
  letter-spacing:0.3px;border:none;white-space:nowrap;flex-shrink:0;
}
.tab:hover{color:var(--text);background:var(--surface-3)}
.tab.active{
  background:linear-gradient(135deg,var(--accent) 0%,#d9c200 100%);color:var(--accent-text);
  box-shadow:0 4px 16px rgba(255,230,0,0.3);
}
.tab .count{
  display:inline-block;margin-left:6px;background:var(--danger);color:#fff;
  font-size:10px;font-weight:800;padding:1px 7px;border-radius:10px;min-width:18px;text-align:center;
}
.tab.active .count{background:var(--accent-text);color:var(--accent)}

.topbar{
  background:rgba(18, 5, 28, 0.85);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  padding:12px 20px;display:flex;justify-content:space-between;align-items:center;
  border-bottom:1px solid var(--glass-border);flex-wrap:wrap;gap:12px;
  box-shadow:0 4px 30px rgba(0,0,0,0.4);position:sticky;top:0;z-index:50;
}
.topbar-brand{display:flex;align-items:center;gap:14px}
.topbar-logo{width:110px;flex-shrink:0;display:block}
.topbar-logo img{width:100%;height:auto;display:block;border-radius:8px;filter:drop-shadow(0 2px 8px rgba(0,0,0,0.5))}
.topbar-user{display:flex;align-items:center;gap:12px}
.topbar-user-info{display:flex;flex-direction:column;gap:1px;text-align:right}
.topbar-user-info .name{font-size:13px;font-weight:700;color:var(--text)}
.topbar-user-info .meta{font-size:11px;color:var(--text-dim);letter-spacing:0.2px}
.topbar-avatar{
  width:44px;height:44px;border-radius:50%;overflow:hidden;border:2px solid var(--accent);
  background:linear-gradient(135deg,var(--primary) 0%,var(--primary-light) 100%);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 3px 12px rgba(255,230,0,0.25);
}
.topbar-avatar img{width:100%;height:100%;object-fit:cover;display:block}
.topbar-avatar .initial{font-size:16px;font-weight:800;color:var(--accent);text-transform:uppercase}

.photo-upload{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:10px}
.photo-preview{
  width:120px;height:150px;border-radius:var(--radius-sm);background:rgba(20,7,32,0.9);
  border:2px dashed var(--border-light);display:flex;align-items:center;justify-content:center;
  overflow:hidden;flex-shrink:0;transition:all var(--t);box-shadow:inset 0 2px 10px rgba(0,0,0,0.4);
}
.photo-preview.has-photo{border-style:solid;border-color:var(--accent);box-shadow:0 6px 20px rgba(255,230,0,0.25)}
.photo-preview img{width:100%;height:100%;object-fit:cover}
.photo-placeholder{color:var(--text-muted);font-size:11px;text-align:center;padding:10px;line-height:1.4}
.photo-actions{display:flex;flex-direction:column;gap:8px;flex:1;min-width:180px}
.photo-actions .btn{width:100%;padding:10px 16px;font-size:13px}
.photo-hint{font-size:11px;color:var(--text-muted);line-height:1.4;margin-top:2px}

.badge{
  background:var(--primary-soft);color:var(--accent);border:1px solid var(--border-strong);
  padding:5px 12px;border-radius:20px;font-size:11px;font-weight:800;letter-spacing:0.5px;
  text-transform:uppercase;width:fit-content;display:inline-flex;align-items:center;gap:6px;
}
.badge.green{background:rgba(0,230,118,0.12);color:#3ccf8e;border-color:rgba(60,207,142,0.35)}
.badge.red{background:rgba(255,77,77,0.12);color:#ff8585;border-color:rgba(255,77,77,0.35)}
.badge.master{
  background:linear-gradient(135deg,var(--accent) 0%,#d9c200 100%);color:var(--accent-text);
  border-color:var(--accent);box-shadow:0 2px 10px rgba(255,230,0,0.25);
}
.badge.warn{background:rgba(255,193,7,0.14);color:#ffc107;border-color:rgba(255,193,7,0.4)}

.container{max-width:1150px;margin:0 auto;padding:20px 16px}
.grid{display:grid;gap:16px;grid-template-columns:1fr 1fr}
.grid3{display:grid;gap:16px;grid-template-columns:1fr 1fr 1fr}
@media(max-width:900px){.grid3{grid-template-columns:1fr 1fr}}
@media(max-width:650px){.grid,.grid3{grid-template-columns:1fr}}

.section{margin-top:20px}
.flex{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sp{justify-content:space-between}

.table-responsive{width:100%;overflow-x:auto;border-radius:var(--radius-sm);border:1px solid var(--border);margin-top:16px}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--border)}
th{background:rgba(20,7,32,0.95);color:var(--accent);font-weight:800;font-size:11px;text-transform:uppercase;letter-spacing:0.8px}
td{background:rgba(28,12,41,0.65);backdrop-filter:blur(4px)}
tr:last-child td{border-bottom:none}
tr.clickable{cursor:pointer;transition:all var(--t-fast)}
tr.clickable:hover td{background:rgba(52,26,77,0.85);color:var(--accent)}

.modal-bg{
  position:fixed;inset:0;background:rgba(10,3,16,0.82);backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;
  z-index:999;padding:16px;animation:fadeInUp 0.25s cubic-bezier(0.16,1,0.3,1) both;
}
.modal{
  background:linear-gradient(145deg,rgba(28,12,41,0.95) 0%,rgba(20,7,32,0.98) 100%);
  border-radius:var(--radius);padding:24px;max-width:850px;width:100%;max-height:90vh;
  overflow-y:auto;border:1px solid var(--border-light);box-shadow:var(--shadow-lg);
  animation:scaleIn 0.3s cubic-bezier(0.16,1,0.3,1) both;
}
@media(max-width:600px){.modal{padding:18px;max-height:95vh}}

.state-item{
  display:flex;justify-content:space-between;padding:13px 16px;background:rgba(20,7,32,0.7);
  border-radius:var(--radius-sm);margin-bottom:8px;cursor:pointer;align-items:center;
  border:1px solid var(--border);transition:all var(--t);font-size:13.5px;
}
.state-item:hover{
  background:rgba(41,20,61,0.9);border-color:var(--primary-light);transform:translateX(4px);
  box-shadow:0 4px 15px rgba(108,15,163,0.3);
}
.collapse-body{
  padding:14px 16px;background:rgba(15,5,25,0.85);border-radius:var(--radius-sm);
  margin-bottom:10px;border:1px solid var(--border);border-left:3px solid var(--accent);
}

.login-wrap{max-width:480px;margin:4vh auto;padding:16px;animation:fadeInUp 0.5s cubic-bezier(0.16,1,0.3,1) both}
.login-logo{width:100%;max-width:240px;margin:0 auto 16px;filter:drop-shadow(0 4px 16px rgba(0,0,0,0.6))}
.login-logo img{width:100%;height:auto;display:block;border-radius:12px}

.field{position:relative}
.pw-toggle{
  position:absolute;right:14px;top:38px;cursor:pointer;font-size:11.5px;color:var(--accent);
  font-weight:800;user-select:none;letter-spacing:0.5px;text-transform:uppercase;
  transition:all var(--t-fast);background:none;border:none;padding:4px;
}
.pw-toggle:hover{color:#fff;text-shadow:0 0 10px rgba(255,230,0,0.6)}

.success-box{
  padding:20px;background:linear-gradient(135deg,rgba(41,20,61,0.9) 0%,rgba(20,7,32,0.95) 100%);
  border-radius:var(--radius-sm);text-align:center;border:1px solid var(--border-light);
  border-left:4px solid var(--accent);box-shadow:var(--shadow-sm);animation:fadeInUp 0.3s ease;
}
.batch-tag{
  font-size:11px;color:var(--accent);font-weight:800;margin-bottom:10px;letter-spacing:1px;
  text-transform:uppercase;padding:5px 12px;background:var(--accent-soft);border-radius:20px;
  display:inline-block;border:1px solid rgba(255,230,0,0.25);
}
.readonly-banner{
  padding:13px 16px;border-left:3px solid var(--accent);background:rgba(20,7,32,0.8);
  border-radius:var(--radius-sm);font-size:12.5px;line-height:1.5;color:var(--text-dim);margin-top:14px;
}
.readonly-banner b{color:var(--accent)}

.print-area{padding:20px;background:#fff;color:#000;display:none}
@media print{
  body *{visibility:hidden}
  .print-area,.print-area *{visibility:visible}
  .print-area{display:block!important;position:absolute;left:0;top:0;width:100%}
}

#toasts{position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:340px;width:100%}
.toast{
  padding:12px 16px;border-radius:10px;background:rgba(28,12,41,0.95);backdrop-filter:blur(12px);
  border:1px solid var(--border-light);box-shadow:var(--shadow-lg);font-size:13px;
  animation:fadeInUp 0.25s cubic-bezier(0.16,1,0.3,1) both;pointer-events:auto;color:var(--text);
}
.toast.ok{border-left:3px solid var(--accent)}
.toast.err{border-left:3px solid var(--danger)}
.toast.info{border-left:3px solid var(--primary-light)}

.loader{
  display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,0.3);
  border-top-color:var(--accent);border-radius:50%;animation:spin 0.7s linear infinite;
  vertical-align:-2px;margin-right:8px;
}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:480px){
  .topbar-logo{width:80px}
  .topbar{padding:10px 14px;gap:8px}
  .topbar-user{gap:8px}
  .topbar-avatar{width:38px;height:38px}
  .topbar-user-info .name{font-size:11.5px}
  .topbar-user-info .meta{font-size:10px}
  .card{padding:16px}
}

::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--surface-2)}
::-webkit-scrollbar-thumb{background:var(--primary);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--primary-light)}
::selection{background:var(--accent);color:var(--accent-text)}

.detail-grid{display:grid;grid-template-columns:160px 1fr;gap:0;border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;margin-top:14px}
@media(max-width:550px){.detail-grid{grid-template-columns:1fr}}
.detail-grid .k{background:rgba(20,7,32,0.85);padding:10px 14px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:0.6px;color:var(--accent);border-bottom:1px solid var(--border)}
.detail-grid .v{background:rgba(28,12,41,0.5);padding:10px 14px;font-size:13px;border-bottom:1px solid var(--border)}
.detail-photo{width:130px;height:165px;object-fit:cover;border-radius:8px;border:2px solid var(--accent);box-shadow:0 4px 16px rgba(255,230,0,0.2)}

.mep-num-preview{
  display:inline-block;padding:8px 14px;background:rgba(255,230,0,0.08);
  border:1px dashed rgba(255,230,0,0.5);border-radius:8px;font-family:'Courier New',monospace;
  font-size:15px;font-weight:800;color:var(--accent);letter-spacing:1px;margin-top:6px;
}
.mep-num-preview.pending{opacity:0.55;font-style:italic}

.reglamento-doc{background:#ffffff;color:#1c1c1c;padding:24px;border-radius:12px;line-height:1.75;font-family:Georgia,'Times New Roman',serif;box-shadow:0 10px 30px rgba(0,0,0,0.3)}
.reglamento-doc .rm-header{text-align:center;padding-bottom:16px;border-bottom:2px solid #6c0fa3;margin-bottom:20px}
.reglamento-doc .rm-logo{font-size:22px;font-weight:800;color:#6c0fa3;letter-spacing:2px}
.reglamento-doc .rm-partido{font-size:11px;color:#555;margin-top:2px}
.reglamento-doc h2{color:#6c0fa3;margin-top:14px;border:none;padding:0;font-size:22px}
.reglamento-doc h2::after{display:none}
.reglamento-doc .rm-fecha{font-size:12px;color:#555;margin-top:6px}
.reglamento-doc .rm-cap{margin-top:28px}
.reglamento-doc .rm-cap h3{color:#6c0fa3;font-size:14.5px;padding:9px 12px;background:#f7f0fc;border-left:4px solid #6c0fa3;text-transform:uppercase;letter-spacing:0.5px}
.reglamento-doc .rm-art{margin-top:14px}
.reglamento-doc .rm-art-num{font-weight:700;color:#222;margin-bottom:4px}
.reglamento-doc .rm-art-txt{text-align:justify}
.reglamento-doc .rm-lista{margin-top:8px;padding-left:12px}
.reglamento-doc .rm-lista p{margin:4px 0;text-align:justify}
.reglamento-doc .rm-parrafo{margin-top:10px;padding:10px 14px;background:#f7f0fc;border-left:3px solid #6c0fa3;font-style:italic;font-size:13px}
.reglamento-doc .rm-footer{text-align:center;margin-top:40px;padding-top:20px;border-top:1px solid #ddd;color:#555;font-size:12px}

/* Bloque de aprobación */
.aprob-box{
  padding:16px;border-radius:var(--radius-sm);border:1px solid var(--border);
  background:rgba(20,7,32,0.7);margin-top:14px;
}
.aprob-box.aprobado{border-color:rgba(60,207,142,0.4);background:rgba(0,230,118,0.06)}
.aprob-box.rechazado{border-color:rgba(255,77,77,0.4);background:rgba(255,77,77,0.06)}
.aprob-box.pendiente{border-color:rgba(255,193,7,0.4);background:rgba(255,193,7,0.06)}
.aprob-meta{font-size:11.5px;color:var(--text-muted);margin-top:6px;line-height:1.4}
.aprob-meta b{color:var(--text-dim)}

const REGLAMENTO_MEP = {
  titulo: 'Reglamento Electoral Interno',

  lugar: 'Caracas, 16 de octubre de 2023',
  capitulos: [
    { titulo:'CAPÍTULO I — DISPOSICIONES FUNDAMENTALES', articulos: [
      { n:1, texto:'El presente reglamento regirá los procesos electorales que se celebren en el Movimiento Electoral del Pueblo (MEP) Partido Socialista de Venezuela para elegir las autoridades partidistas, candidatos a los cuerpos deliberantes, candidato a la Presidencia de la República, Gobernadores y Alcaldes de acuerdo a las disposiciones estatutarias.' },
      { n:2, texto:'La elección de los miembros de los Comandos Políticos Nacional y Regional, Comisión de Ética y Disciplina Nacional y Regional, Comisión Electoral Nacional y Regional, Contralor Interno, Burós Sectoriales, Comando Municipal o Parroquial y Local y demás funcionarios o delegados, previstos en los Estatutos, se hará de conformidad con lo establecido en este Reglamento.' },
      { n:3, texto:'La Comisión Electoral Nacional tendrá cinco (05) miembros principales y cinco (05) miembros suplentes y en estructura Regional y Municipal tres (03) miembros principales y tres (03) miembros suplentes, para dirigir, organizar y controlar los procesos electorales previstos en los Estatutos y este Reglamento.' },
      { n:4, texto:'La Comisión Electoral Municipal funcionará en la ciudad Capital de cada Municipio o Parroquia.' },
      { n:5, texto:'Serán miembros principales de la Comisión Electoral Interna respectiva los candidatos y candidatas que obtengan la más alta votación y serán suplentes los y las que le sigan en la votación, en forma descendente.', parrafo:'PARÁGRAFO ÚNICO: En caso de empate en la votación entre dos (02) o más candidatos o candidatas, se repetirá la votación con los que resultaren empatados para decidir la prelación.' },
      { n:6, texto:'Los candidatos o candidatas a las Comisiones Electorales Internas no podrán estar sometidos o sometidas a investigación o sanción disciplinaria de los órganos competentes, ni tener cargos de Dirección Política en cualquier nivel o sector.' },
      { n:7, texto:'Las Comisiones Electorales Internas se instalarán sin previa convocatoria una vez electas y se reunirán en las oportunidades fijadas para cumplir sus funciones.' },
      { n:8, texto:'Las decisiones de las Comisiones Electorales Internas serán de acuerdo al contenido del Artículo 43 de nuestros Estatutos y tendrán apelación por ante el Órgano Superior. De la Comisión Nacional sólo se oirá Recurso, por ante la Dirección Política Nacional (D.P.N.).' },
      { n:9, texto:'Las postulaciones ante los órganos electorales competentes serán personales y estarán avalados por no menos de tres (03) postulantes y la aceptación del candidato o candidata postulado.' }
    ]},
    { titulo:'CAPÍTULO II — DISPOSICIONES GENERALES. MÉTODOS DE ELECCIÓN', articulos: [
      { n:10, texto:'Los métodos de elección establecidos para los procesos electorales a lo interno del partido son:', lista:[
        'a) Elección directa, universal y secreta: proceso en el cual los votantes eligen directamente entre candidatos a un cargo, sin intermediación por parte de otra persona u órgano; es opuesto al sufragio indirecto.',
        'b) Cooptación: sistema de elección por nominación interna, por el cual una asociación nombra internamente a sus miembros nuevos por nominación de los miembros antiguos, sin dependencia de criterios externos.',
        'c) Elecciones de Primer Grado, Segundo Grado o Tercer Grado:',
        '   • PRIMER GRADO: elección libre, directa, universal, secreta y sin intermediarios.',
        '   • SEGUNDO GRADO: elección indirecta, en la que se eligen representantes que constituyen un cuerpo o colegio electoral para designar los titulares.',
        '   • TERCER GRADO: cuando las personas votan para escoger un representante y este a su vez designa a otro, en otra votación, para que sea el titular.',
        'd) Las Asambleas: grupo formado por miembros de una organización que se reúnen periódicamente para tomar decisiones sobre un ámbito o área específica.',
        'e) Por opinión y/o consenso: proceso de decisión que busca el acuerdo de la mayoría y también resolver o atenuar las objeciones de la minoría.',
        'f) Por Aclamación: acuerdo y consenso hecho por todas las personas en una situación dada sin discrepancia.',
        'g) Por procedimientos y mecanismos virtuales: toma de decisiones utilizando herramientas e instrumentos virtuales que permitan ejercer el derecho al voto.'
      ]}
    ]},
    { titulo:'CAPÍTULO III — DE LAS COMISIONES ELECTORALES INTERNAS', articulos: [
      { n:11, texto:'La Comisión Electoral Nacional Interna estará integrada por los primeros cinco (05) miembros electos con el mayor número de votos (incluyendo al Coordinador o Coordinadora, el cual o la cual será electo o electa en el seno de la Comisión), en elección de los órganos electorales; los restantes cinco (05) miembros que le siguen en votación serán los suplentes.' },
      { n:12, texto:'La Comisión Electoral Nacional, además de lo establecido en los Estatutos, tendrá entre otras atribuciones las siguientes:', lista:[
        'a) Convocar a elecciones en concordancia con los Estatutos y los requerimientos de la Organización.',
        'b) Organizar, dirigir, controlar los procesos electorales internos.',
        'c) Designar comisiones electorales especiales, previamente convenidas en el Comando Político Nacional (C.P.N.), cuando las circunstancias lo ameriten.',
        'd) Resolver sobre diseños, propagandas, papeletas y modalidades de todo el Sistema Electoral Interno.',
        'e) Decidir sobre las apelaciones, consultas e interpretaciones de la materia electoral interna.',
        'f) Recibir, estudiar, admitir o rechazar las postulaciones de candidatos a los cargos directivos del Partido en el ámbito nacional, regional, municipal y/o parroquial.',
        'g) Conformar conjuntamente con la Secretaría Nacional de Organización y los testigos de los candidatos y candidatas, los listados de militantes inscritos y aptos para votar y darlos a conocer internamente a los órganos que corresponda.',
        'h) Hacer los instrumentos electorales que sean pertinentes y autorizar el funcionamiento de mesas electorales adicionales.',
        'i) Recibir los recaudos electorales internos y resguardarlos.',
        'j) Tomar las demás previsiones que sean necesarias para regular la pureza de los procesos electorales.'
      ]},
      { n:13, texto:'En cada Comando Político Regional habrá una Comisión Electoral Regional, integrada por tres (03) miembros electos por la Asamblea Regional correspondiente y sus respectivos suplentes, y funcionará en la sede del Comando Político Regional (C.P.R).' }
    ]},
    { titulo:'CAPÍTULO IV — DE LAS ASAMBLEAS', articulos: [
      { n:18, texto:'Integrantes de la Asamblea Nacional:', lista:[
        '1. Los miembros de la Dirección Política Nacional (D.P.N.).',
        '2. Los diputados o diputadas al Parlamento Nacional (principales y suplentes), legisladores o legisladoras regionales (principales y suplentes), concejales o concejalas (principales y suplentes), alcaldes o alcaldesas y gobernador o gobernadora militantes.',
        '3. Un (01) delegado o delegada principal representante en organizaciones de masa con mejor desempeño en votación en el último evento electoral realizado en el país.',
        '4. Un (01) delegado que sea directivo principal en organizaciones de masa para el momento de la actualización de la nómina de la Asamblea.',
        '5. Los Gobernadores o Gobernadoras y Alcaldes o Alcaldesas militantes.',
        '6. Podrán también ser delegados los independientes que en su acción política coincidan con la Línea Política del MEP, previa calificación del C.P.N.'
      ]},
      { n:19, texto:'La Asamblea Regional la integran:', lista:[
        '1. Los miembros de la Dirección Política Regional (D.P.R.).',
        '2. Diputados o diputadas regionales al Parlamento Nacional correspondientes al respectivo estado (principales y suplentes); legisladores y legisladoras regionales (principales y suplentes); concejales o concejalas (principales y suplentes); alcaldes o alcaldesas y gobernador o gobernadora militantes.',
        '3. Un (01) delegado o delegada principal representante en organizaciones regionales de masa.',
        '4. El Secretario General y un (01) delegado electo en el seno del CPM de cada uno de los tres (03) municipios de mejor desempeño en votos en el último evento electoral realizado en el país.',
        '5. También podrán ser delegados los independientes que en su acción política coincidan con la Línea Política del MEP, previa calificación del C.P.R.'
      ]},
      { n:20, texto:'La Asamblea Municipal y Parroquial la integran:', lista:[
        '1. Los miembros del Comando Político Municipal.',
        '2. El Secretario General de cada Comando Político Parroquial.',
        '3. Un (01) Coordinador o Coordinadora de cada Comité Local.',
        '4. Un (01) delegado principal de organizaciones de masas, a nivel municipal no partidistas, conforme lo establezca la respectiva reglamentación.',
        '5. Los militantes diputados o diputadas nacionales principales y suplentes, legisladores o legisladoras regionales (principales y suplentes), concejales o concejalas (principales y suplentes) que hagan vida activa o residan en el Municipio respectivo y el alcalde o alcaldesa militante.'
      ]}
    ]},
    { titulo:'CAPÍTULO V — DE LA ELABORACIÓN DEL LISTADO DE ASISTENTES A LAS ASAMBLEAS', articulos: [
      { n:21, texto:'El cuaderno de votación de las Asambleas se hará en base al listado elaborado por la Secretaría Nacional de Organización y la Comisión Electoral Nacional. El listado contendrá los siguientes datos:', lista:[
        'a) Nombres y Apellidos.','b) Cédula de Identidad.','c) Número de contacto.','d) Dirección de habitación.','e) Registro de Información Fiscal (RIF).','f) Fecha de nacimiento.','g) Estado.','h) Municipio.','i) Acta de nombramiento y su respectiva aprobación por parte del Comando Político Nacional, Regional, Municipal y/o Parroquial, según sea el caso, al cargo o condición que lo acredite como miembro de la Asamblea.'
      ]},
      { n:22, texto:'La Secretaría Nacional de Organización en consulta con la Comisión Electoral Nacional, Regional, Municipal y/o Parroquial, según sea el caso, establecerá los períodos de recepción y entrega del listado.' },
      { n:23, texto:'El listado definitivo de los miembros de la Asamblea servirá de base para producir los cuadernos de votación.' },
      { n:24, texto:'La Comisión Electoral Nacional establecerá, en cada caso, el lapso para fijar los listados en los espacios de votación.' }
    ]},
    { titulo:'CAPÍTULO VI — DE LOS CENTROS DE VOTACIÓN', articulos: [
      { n:25, texto:'Los actos electorales tendrán su expresión en mesas de votación integradas por representantes de la Comisión Electoral respectiva y los testigos de los candidatos postulados.' },
      { n:26, texto:'Corresponde a la Mesa Electoral Interna, entre otras atribuciones, las siguientes:', lista:[
        'a) Convocar a su propia instalación, acondicionar el local, para guardar el secreto del voto, evitar acciones de militantes reñidas con el acto de votación y el derecho al libre ejercicio del voto en el recinto.',
        'b) Recibir y disponer el local, listado de electores, material electoral y las demás providencias del caso.',
        'c) Presidir el acto de votación con las regulaciones estipuladas.',
        'd) Realizar el escrutinio y llenar con los resultados las actas respectivas.',
        'e) Remitir inmediatamente el resultado electoral (actas de votación) al Organismo Electoral Superior.',
        'f) Se enviarán los resultados por los grupos de información internos establecidos.'
      ]}
    ]},
    { titulo:'CAPÍTULO VII — DE LAS POSTULACIONES', articulos: [
      { n:27, texto:'Los aspirantes a los cargos para los órganos de dirección del Partido deberán cumplir los requisitos exigidos en los Estatutos y el Reglamento Electoral Interno, tales como:', lista:[
        'a) Presentación del Currículo profesional.','b) Presentación del Currículo político.','c) Presentación del Plan de gestión.','d) Presentación de una fotocopia de la cédula de identidad.','e) Ser venezolano.','f) No tener antecedentes penales.','g) Tener un tiempo de militancia mínimo de: 3 años para postularse a cargos nacionales, 1 año para postularse a cargos regionales y municipales.'
      ], parrafo:'PÁRRAFO ÚNICO: No podrán postularse a cargos nacionales, estadales y municipales, personas que hayan renunciado a algún cargo o hayan sido expulsados del partido.' },
      { n:28, texto:'Las postulaciones se harán por escrito debidamente firmadas por el Postulado o Postulada y los postulantes que le apoyen, con nombres y apellidos completos, cédula de identidad, por ante la Comisión Electoral Interna respectiva, y ésta deberá estudiarlas y dar respuesta a los interesados en los lapsos establecidos.' },
      { n:29, texto:'Con los postulados a cada órgano, se hará una lista en orden alfabético por cada plancha existente, a los efectos de la elección nominal a que haya lugar y a la elaboración de la boleta electoral correspondiente.' },
      { n:30, texto:'Para los cargos de los órganos partidistas nacionales, las postulaciones se harán ante la Comisión Electoral Nacional Interna.' }
    ]},
    { titulo:'CAPÍTULO VIII — DE LOS REGISTROS ELECTORALES', articulos: [
      { n:31, texto:'Se denominan Registros Electorales:', lista:[
        'a) Las Actas de Instalación de las Comisiones Electorales Internas.','b) Los libros o Listados de Votación.','c) La nómina de militantes con derecho a voto.','d) Las actas de escrutinios de la mesa de votación.'
      ]},
      { n:32, texto:'Los cuadernos de votación son registros que deben organizar las Comisiones Electorales Internas de acuerdo a las instrucciones siguientes:', lista:[
        '1) Cada libro o listado de votación será válido para un solo proceso electoral.',
        '2) Los libros de votación serán conformados por las Comisiones Electorales Internas y deberán contener lo siguiente:',
        '   a) Apellidos y nombres completos.','   b) Cédula de Identidad.','   c) Espacio en blanco para la firma del votante.','   d) Huella dactilar.','   e) Observaciones.'
      ]},
      { n:33, texto:'El cuaderno de votación se organizará con los listados de los registros de los miembros del Partido con derecho a voto, revisado conjuntamente con la Secretaría de Organización correspondiente.' },
      { n:34, texto:'En el cuaderno de votación deben aparecer los mismos datos que en la nómina de los militantes con derecho al voto. Los listados serán colocados en los locales previstos para el acto de votación.', parrafo:'PÁRRAFO ÚNICO: Los militantes con derecho al voto que no aparezcan en dichas nóminas podrán introducir su reclamación ante la Comisión Electoral respectiva.' }
    ]},
    { titulo:'CAPÍTULO IX — DEL ACTO DE VOTACIÓN', articulos: [
      { n:35, texto:'Las votaciones se harán en el lugar escogido previamente, la fecha y las horas fijadas por la Comisión Electoral Nacional.' },
      { n:36, texto:'El día de las elecciones se instalará la mesa en el lugar fijado, mostrando el recipiente o urna electoral vacío, y se cerrará en público.' },
      { n:37, texto:'Cada elector deberá identificarse con la cédula de identidad laminada vigente o vencida y, una vez confirmado con el listado de los votantes allí registrados, se le proveerá del material electoral para que emita su(s) voto(s), dejando constancia de ello.' },
      { n:38, texto:'El elector imposibilitado podrá hacerse acompañar por una persona de su confianza, para que en su nombre emita el voto.' },
      { n:39, texto:'La elección podrá ser por planchas, marcando con una equis (X) sólo a una plancha.' }
    ]},
    { titulo:'CAPÍTULO X — DEL ESCRUTINIO', articulos: [
      { n:40, texto:'Concluido el acto de votación se anunciará en alta y viva voz que se va a escrutar.' },
      { n:41, texto:'Los resultados se reflejarán en el acta respectiva.' }
    ]},
    { titulo:'CAPÍTULO XI — DE LA PROPAGANDA ELECTORAL', articulos: [
      { n:42, texto:'Los candidatos o candidatas de cada plancha y postulantes podrán usar la propaganda electoral oral, escrita y/o audiovisual.' },
      { n:43, texto:'No se permitirá propaganda tendenciosa, anónima o que atente contra la dignidad de otros militantes.' },
      { n:44, texto:'Las Comisiones Electorales respectivas enviarán informe y resolverán sumariamente los actos reñidos con las disposiciones estatutarias.' },
      { n:45, texto:'A las cuarenta y ocho (48) horas anteriores a las elecciones cesará toda clase de propaganda.' },
      { n:46, texto:'Los recursos del Partido destinados a los fines del proceso electoral durante la campaña electoral se administrarán en forma racional, equitativa y sin ninguna discriminación.' }

/* ============================================================
   UTILIDADES
============================================================ */
function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function now(){ return Date.now(); }
function uid(){ return 'id_'+Math.random().toString(36).slice(2,10)+Date.now().toString(36); }
function fmtDate(ts){ return new Date(Number(ts)||0).toLocaleString('es-VE'); }
function normCI(ci){
  let s = String(ci||'').trim().toUpperCase().replace(/[\s\.\-]/g,'');
  if(!s) return '';
  if(/^\d+$/.test(s)) return 'V-' + s;
  if(/^[VEJPG]\d+$/.test(s)) return s[0] + '-' + s.slice(1);
  return s;
}
function isValidCI(ci){ return /^[VEJPG]-\d{5,9}$/.test(normCI(ci)); }
function isValidPhone(t){ return /^0\d{3}-?\d{7}$/.test(String(t||'').trim()); }
function isValidEmail(e){ if(!e) return true; return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e); }

function safeImgSrc(src){
  if(typeof src !== 'string') return '';
  if(src.startsWith('data:image/')) return src;
  if(/^https?:\/\//i.test(src)) return src;
  return '';
}
function devHash(pw){ let h=0; for(let i=0;i<pw.length;i++){ h=((h<<5)-h)+pw.charCodeAt(i); h|=0; } return 'h'+h; }

function cleanAlpha(s){ return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-z]/g,'').toUpperCase(); }
function shortCode(s, len){ len = len || 4; let t = cleanAlpha(s); if(!t) return 'XXXX'; if(t.length < len) t = t.padEnd(len,'X'); return t.slice(0,len); }
function mepPrefix(estado, municipio){ return 'MEP-CNE-' + shortCode(estado,4) + '-' + shortCode(municipio,4) + '-' + new Date().getFullYear(); }
function mepPreviewNumber(estado, municipio){
  if(!estado || !municipio) return 'MEP-CNE-____-____-' + new Date().getFullYear() + '-____';
  const prefix = mepPrefix(estado, municipio);
  const n = parseInt(localStorage.getItem('cne_counter_'+prefix) || '0', 10) + 1;
  return prefix + '-' + String(n).padStart(4,'0');
}
function mepReserveNumber(estado, municipio){
  const prefix = mepPrefix(estado, municipio);
  const key = 'cne_counter_'+prefix;
  let n = parseInt(localStorage.getItem(key) || '0', 10) + 1;
  localStorage.setItem(key, String(n));
  return prefix + '-' + String(n).padStart(4,'0');
}
function mepRandomSuffix(){
  return 'MEP-CNE-EXT-' + Date.now().toString(36).toUpperCase().slice(-6) + '-' + Math.random().toString(36).slice(2,5).toUpperCase();
}

function toast(msg, type){
  type = type || 'info';
  const c = document.getElementById('toasts');
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  c.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(), 300); }, 3200);
}
function ok(m){ toast(m,'ok'); } function err(m){ toast(m,'err'); } function info(m){ toast(m,'info'); }

function compressImage(file, maxW, quality){
  maxW = maxW || CONFIG.IMG_MAX_WIDTH;
  quality = quality || CONFIG.IMG_QUALITY;
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onerror = () => reject(new Error('No se pudo leer el archivo.'));
    r.onload = e => {
      const img = new Image();
      img.onerror = () => reject(new Error('Imagen inválida.'));
      img.onload = () => {
        let w = img.width, h = img.height;
        if(w > maxW){ h = Math.round(h * maxW / w); w = maxW; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = e.target.result;
    };
    r.readAsDataURL(file);
  });
}

async function handlePhotoInput(input, id){
  const file = input.files && input.files[0];
  if(!file) return;
  if(!/^image\//.test(file.type)) return err('El archivo no es una imagen.');
  if(file.size > 10 * 1024 * 1024) return err('Imagen demasiado grande (máx 10 MB).');
  try{
    const dataUrl = await compressImage(file);
    const pv = document.getElementById('pv_' + id);
    if(pv){ pv.innerHTML = '<img src="' + dataUrl + '" alt="foto">'; pv.classList.add('has-photo'); }
    photoCache[id] = { file, dataUrl };
  }catch(e){ err('Error al procesar la imagen.'); }
  finally{ input.value = ''; }
}

/* ============================================================
   PERMISOS
============================================================ */
const Roles = { MASTER:'Master', NACIONAL:'Nacional', CPR:'CPR', CPM:'CPM' };
const Permissions = {
  isMaster(u){ return !!u && u.rol === Roles.MASTER; },
  isNacional(u){ return !!u && u.rol === Roles.NACIONAL; },
  isOperativo(u){ return !!u && (u.rol === Roles.CPR || u.rol === Roles.CPM); },
  isApprover(u){ return !!u && u.rol === Roles.NACIONAL && !!u.es_aprobador; },
  canSeeNacionalesTab(u){ return Permissions.isMaster(u); },
  canSeeAprobacionesTab(u){ return Permissions.isMaster(u) || Permissions.isApprover(u); },
  creatableRoles(u){
    if(!u) return [Roles.CPR, Roles.CPM]; // Para el registro público desde login
    if(Permissions.isMaster(u)) return [Roles.NACIONAL, Roles.CPR, Roles.CPM];
    if(Permissions.isNacional(u)) return [Roles.CPR, Roles.CPM];
    return [];
  },
  canCreateRole(u, rol){ return Permissions.creatableRoles(u).includes(rol); },
  canManageUser(actor, target){
    if(!actor || !target) return false;
    if(actor.id === target.id) return false;
    if(target.rol === Roles.MASTER) return false;
    if(Permissions.isMaster(actor)) return [Roles.NACIONAL, Roles.CPR, Roles.CPM].includes(target.rol);
    if(Permissions.isNacional(actor)) return [Roles.CPR, Roles.CPM].includes(target.rol);
    return false;
  },
  canToggleAprobador(actor, target){
    return Permissions.isMaster(actor) && target && target.rol === Roles.NACIONAL;
  },
  canApprove(actor){
    return Permissions.isMaster(actor) || Permissions.isApprover(actor);
  }
};

const DB = {
  get(k, def){ try{ const v = localStorage.getItem('cne_'+k); return v ? JSON.parse(v) : def; }catch(e){ return def; } },

    catch(e){ if(e && e.name === 'QuotaExceededError') err('Almacenamiento local lleno.'); throw e; }
  },
  remove(k){ localStorage.removeItem('cne_'+k); }
};

function isAuthError(e){
  return e && (e.status === 401 || e.status === 403) && !!(e.message && /auth|token|unauth|forbidden/i.test(e.message));
}
function userSessionFromRecord(u){
  return {
    id:u.id, nombre:u.nombre, apellido:u.apellido, ci:u.ci, telefono:u.telefono,
    rol:u.rol, estado:u.estado||'', municipio:u.municipio||'',
    foto: u.foto ? (typeof u.foto === 'string' ? u.foto : (pb ? pb.files.getUrl(u, u.foto) : '')) : '',
    es_aprobador: !!u.es_aprobador,
    aprobado: !!u.aprobado
  };
}

/* ============================================================
   API CON POCKETBASE
============================================================ */
const Api = {
  async login(ci, pw){
    if(CONFIG.USE_POCKETBASE){
      await pbLoad;
      try {
        const auth = await pb.collection(CONFIG.COL.USERS).authWithPassword(normCI(ci), pw);
        const sess = userSessionFromRecord(auth.record);
        await Api.history.log(sess);
        return sess;
      } catch (e) {
        // Error 400 en PB significa credenciales incorrectas O cuenta no aprobada (debido a la Auth Rule)
        if (e.status === 400) throw new Error('Credenciales incorrectas o cuenta pendiente de aprobación por un Master.');
        throw e;
      }
    }
    // Lógica Local (Fallback)
    const users = DB.get('users', []);
    const u = users.find(x => normCI(x.ci) === normCI(ci) && x.password === devHash(pw));
    if(!u) throw new Error('Credenciales inválidas.');
    const sess = userSessionFromRecord(u);
    DB.set('session', sess);
    await Api.history.log(sess);
    return sess;
  },
  async register(data, actor){
    if(actor === null || actor === 'BOOTSTRAP'){
      if(data.rol !== Roles.MASTER) throw new Error('Bootstrap solo puede crear el Master.');
    } else {
      if(!Permissions.canCreateRole(actor, data.rol)) throw new Error('No tenés permisos para crear usuarios con rol ' + data.rol + '.');
    }
    
    if(CONFIG.USE_POCKETBASE){
      await pbLoad;
      const fd = new FormData();
      ['nombre','apellido','telefono','rol','estado','municipio'].forEach(k => fd.append(k, data[k]||''));
      fd.append('ci', normCI(data.ci));
      fd.append('username', normCI(data.ci));           
      fd.append('password', data.password);
      fd.append('passwordConfirm', data.password);
      fd.append('email', data.email || (normCI(data.ci).toLowerCase().replace(/[^a-z0-9]/g,'')+'@cne.local'));
      fd.append('es_aprobador', data.es_aprobador ? 'true' : 'false');
      fd.append('aprobado', 'false'); // Todo usuario nuevo nace sin aprobar
      
      if(data._fotoFile) fd.append('foto', data._fotoFile);
      
      try {
        const rec = await pb.collection(CONFIG.COL.USERS).create(fd);
        return userSessionFromRecord(rec);
      } catch (e) {
        if (e.status === 400) throw new Error('La cédula o el correo ya están registrados.');
        throw e;
      }
    }
    // Lógica Local
    const users = DB.get('users', []);
    if(users.some(u => normCI(u.ci) === normCI(data.ci))) throw new Error('Ya existe un usuario con esa cédula.');
    const u = {
      id: uid(), nombre:data.nombre, apellido:data.apellido, ci:normCI(data.ci),
      telefono:data.telefono, rol:data.rol, estado:data.estado||'', municipio:data.municipio||'',
      foto: data.foto || '', password: devHash(data.password),
      es_aprobador: !!data.es_aprobador, aprobado: false, created: now()
    };
    users.push(u); DB.set('users', users);
    return u;
  },
  async logout(){
    if(CONFIG.USE_POCKETBASE && pb) pb.authStore.clear();
    DB.remove('session');
  },
  async recover(ci, tel, nueva){
    if(CONFIG.USE_POCKETBASE) throw new Error('En producción la recuperación es por email.');
    const users = DB.get('users', []);
    const u = users.find(x => normCI(x.ci) === normCI(ci) && x.telefono === tel);
    if(!u) throw new Error('No coincide la cédula y el teléfono.');
    u.password = devHash(nueva); DB.set('users', users);
  },
  async changePassword(actor, targetId, nueva){
    const target = (await Api.listUsers()).find(u => u.id === targetId);
    if(!target) throw new Error('Usuario no encontrado.');
    if(!Permissions.canManageUser(actor, target)) throw new Error('No tenés permisos para cambiar esta contraseña.');
    
    if(CONFIG.USE_POCKETBASE){
      await pbLoad;
      await pb.collection(CONFIG.COL.USERS).update(targetId, { password:nueva, passwordConfirm:nueva });
      return;
    }
    const users = DB.get('users', []);
    const u = users.find(x => x.id === targetId);
    if(u){ u.password = devHash(nueva); DB.set('users', users); }
  },
  async deleteUser(actor, targetId){
    const target = (await Api.listUsers()).find(u => u.id === targetId);
    if(!target) throw new Error('Usuario no encontrado.');
    if(!Permissions.canManageUser(actor, target)) throw new Error('No tenés permisos para eliminar este usuario.');
    
    if(CONFIG.USE_POCKETBASE){
      await pbLoad;
      await pb.collection(CONFIG.COL.USERS).delete(targetId);
      return;
    }
    DB.set('users', DB.get('users', []).filter(x => x.id !== targetId));
  },
  async listUsers(){
    if(CONFIG.USE_POCKETBASE){
      await pbLoad;
      const r = await pb.collection(CONFIG.COL.USERS).getFullList({ sort:'-created' });
      return r.map(userSessionFromRecord);
    }
    return DB.get('users', []);
  },
  async toggleAprobador(actor, targetId, value){
    if(!Permissions.isMaster(actor)) throw new Error('Solo el Master puede designar aprobadores.');
    const target = (await Api.listUsers()).find(u => u.id === targetId);
    if(!target) throw new Error('Usuario no encontrado.');
    if(target.rol !== Roles.NACIONAL) throw new Error('Solo usuarios Nacionales pueden ser aprobadores.');
    
    if(CONFIG.USE_POCKETBASE){
      await pbLoad;
      await pb.collection(CONFIG.COL.USERS).update(targetId, { es_aprobador: !!value });
      return;
    }
    const users = DB.get('users', []);
    const u = users.find(x => x.id === targetId);
    if(u){ u.es_aprobador = !!value; DB.set('users', users); }
  },
  async aprobarUsuario(actor, targetId){
    if(!Permissions.isMaster(actor)) throw new Error('Solo el Master puede aprobar usuarios.');
    if(CONFIG.USE_POCKETBASE){
      await pbLoad;
      await pb.collection(CONFIG.COL.USERS).update(targetId, { aprobado: true });
      return;
    }
    const users = DB.get('users', []);
    const u = users.find(x => x.id === targetId);
    if(u){ u.aprobado = true; DB.set('users', users); }
  },
  async validateSession(sess){
    if(CONFIG.USE_POCKETBASE){
      await pbLoad;
      if(!pb.authStore.isValid) return null;
      const u = pb.authStore.record || pb.authStore.model;
      if(!u) return null;
      return userSessionFromRecord(u);
    }
    if(!sess || !sess.id) return null;
    const u = DB.get('users', []).find(x => x.id === sess.id);
    if(!u) return null;
    return userSessionFromRecord(u);
  },
  async saveRecord(rec){
    const base = {
      ...rec,
      aprobacion: rec.aprobacion || APROBACION.PENDIENTE,
      aprobado_por: rec.aprobado_por || '',
      aprobado_por_nombre: rec.aprobado_por_nombre || '',
      aprobado_en: rec.aprobado_en || 0,
      rechazado_motivo: rec.rechazado_motivo || ''
    };
    if(CONFIG.USE_POCKETBASE){
      await pbLoad;
      const fd = new FormData();
      Object.keys(base).forEach(k => { if(k.startsWith('_') || k === 'foto') return; fd.append(k, base[k] ?? ''); });
      if(base._file) fd.append('foto', base._file);
      return await pb.collection(CONFIG.COL.RECORDS).create(fd);
    }
    const all = DB.get('records', []);
    all.push({ id: uid(), ...base, created: now() });
    DB.set('records', all);
  },
  async listRecords(filter){
    filter = filter || {};
    if(CONFIG.USE_POCKETBASE){
      await pbLoad;
      const parts = [];
      if(filter.tipo) parts.push(`tipo="${filter.tipo}"`);
      if(filter.estado) parts.push(`estado="${filter.estado}"`);
      if(filter.municipio) parts.push(`municipio="${filter.municipio}"`);
      if(filter.aprobacion) parts.push(`aprobacion="${filter.aprobacion}"`);
      const opts = parts.length ? { filter: parts.join(' && '), sort:'-created' } : { sort:'-created' };
      const list = await pb.collection(CONFIG.COL.RECORDS).getFullList(opts);
      return list.map(r => ({ ...r, aprobacion: r.aprobacion || APROBACION.PENDIENTE, foto: r.foto ? pb.files.getUrl(r, r.foto) : '' }));
    }
    let r = DB.get('records', []);
    if(filter.tipo) r = r.filter(x => x.tipo === filter.tipo);
    if(filter.estado) r = r.filter(x => x.estado === filter.estado);
    if(filter.municipio) r = r.filter(x => x.municipio === filter.municipio);
    if(filter.aprobacion) r = r.filter(x => (x.aprobacion || APROBACION.PENDIENTE) === filter.aprobacion);
    return r.map(x => ({ ...x, aprobacion: x.aprobacion || APROBACION.PENDIENTE }));
  },
  async existsCI(ci){
    const target = normCI(ci);
    if(CONFIG.USE_POCKETBASE){
      await pbLoad;
      try{
        await pb.collection(CONFIG.COL.RECORDS).getFirstListItem(`ci="${target}"`);
        return true;
      }catch(e){
        if(e && e.status === 404) return false;
        throw e;
      }
    }
    return DB.get('records', []).some(r => normCI(r.ci) === target);
  },
  async existsNumero(numero){
    if(CONFIG.USE_POCKETBASE){
      await pbLoad;
      try{
        await pb.collection(CONFIG.COL.RECORDS).getFirstListItem(`numero="${numero}"`);
        return true;
      }catch(e){
        if(e && e.status === 404) return false;
        throw e;
      }
    }
    return DB.get('records', []).some(r => r.numero === numero);
  },
  async aprobarRecord(actor, id, nota){
    if(!Permissions.canApprove(actor)) throw new Error('No tenés permisos para aprobar registros.');
    const data = {
      aprobacion: APROBACION.APROBADO,
      aprobado_por: actor.id,
      aprobado_por_nombre: (actor.nombre||'') + ' ' + (actor.apellido||''),
      aprobado_en: now(),
      rechazado_motivo: nota || ''
    };
    if(CONFIG.USE_POCKETBASE){
      await pbLoad;
      await pb.collection(CONFIG.COL.RECORDS).update(id, data);
      return;
    }
    const all = DB.get('records', []);
    const r = all.find(x => x.id === id);
    if(!r) throw new Error('Registro no encontrado.');
    Object.assign(r, data);
    DB.set('records', all);
  },
  async rechazarRecord(actor, id, motivo){
    if(!Permissions.canApprove(actor)) throw new Error('No tenés permisos para rechazar registros.');
    const m = String(motivo||'').trim();
    if(m.length < 5) throw new Error('Debe indicar el motivo del rechazo (mínimo 5 caracteres).');
    const data = {
      aprobacion: APROBACION.RECHAZADO,
      aprobado_por: actor.id,
      aprobado_por_nombre: (actor.nombre||'') + ' ' + (actor.apellido||''),
      aprobado_en: now(),
      rechazado_motivo: m
    };
    if(CONFIG.USE_POCKETBASE){
      await pbLoad;
      await pb.collection(CONFIG.COL.RECORDS).update(id, data);
      return;
    }
    const all = DB.get('records', []);
    const r = all.find(x => x.id === id);
    if(!r) throw new Error('Registro no encontrado.');
    Object.assign(r, data);
    DB.set('records', all);
  },
  nextMepNumber(estado, municipio){ return mepReserveNumber(estado, municipio); },
  previewMepNumber(estado, municipio){ return mepPreviewNumber(estado, municipio); },
  history: {
    async log(u){
      const entry = { userId:u.id, nombre:(u.nombre||'')+' '+(u.apellido||''), rol:u.rol, estado:u.estado||'', municipio:u.municipio||'', ts: now() };
      if(CONFIG.USE_POCKETBASE){
        await pbLoad;
        try{ await pb.collection(CONFIG.COL.HISTORY).create(entry); }catch(e){ console.warn('history.log', e); }
        return;
      }
      const h = DB.get('history', []);
      h.push({ id: uid(), ...entry });
      DB.set('history', h);
    },
    async purge(){
      if(CONFIG.USE_POCKETBASE) return;
      const cutoff = now() - CONFIG.HISTORY_TTL_MS;
      DB.set('history', DB.get('history', []).filter(x => Number(x.ts) >= cutoff));
    },
    async list(filtro){
      const cutoff = filtro === 'semana' ? now() - 7*24*60*60*1000 : filtro === 'mes' ? now() - CONFIG.HISTORY_TTL_MS : 0;
      if(CONFIG.USE_POCKETBASE){
        await pbLoad;
        let filter = '';
        if(filtro === 'hoy'){
          const d = new Date(); d.setHours(0,0,0,0);
          filter = `ts >= ${d.getTime()}`;
        } else if(cutoff){
          filter = `ts >= ${cutoff}`;
        }
        const opts = { sort:'-ts' };
        if(filter) opts.filter = filter;
        const list = await pb.collection(CONFIG.COL.HISTORY).getFullList(opts);
        return list.map(x => ({ ...x, ts: Number(x.ts)||0 }));
      }
      return DB.get('history', []).filter(x => {
        const ts = Number(x.ts) || 0;
        if(filtro === 'hoy') return new Date(ts).toDateString() === new Date().toDateString();
        if(cutoff) return ts >= cutoff;
        return true;
      }).sort((a,b) => (Number(b.ts)||0) - (Number(a.ts)||0));
    }
  },
  active: {
    async touch(u){
      if(CONFIG.USE_POCKETBASE){
        await pbLoad;
        const display = (u.nombre||'') + ' ' + (u.apellido||'');
        try{
          const existing = await pb.collection(CONFIG.COL.ACTIVE).getFirstListItem(`userId="${u.id}"`);
          await pb.collection(CONFIG.COL.ACTIVE).update(existing.id, { ts: now(), nombre: display, rol: u.rol });
        }catch(e){
          if(e && e.status === 404){
            try{
              await pb.collection(CONFIG.COL.ACTIVE).create({ userId: u.id, nombre: display, rol: u.rol, ts: now() });
            }catch(e2){ console.warn('active.touch create', e2); }
          } else console.warn('active.touch', e);
        }
        return;
      }
      const a = DB.get('active', {});
      a[u.id] = { id:u.id, nombre:(u.nombre||'')+' '+(u.apellido||''), rol:u.rol, ts: now() };
      const cutoff = now() - CONFIG.ACTIVE_TTL_MS;
      Object.keys(a).forEach(k => { if((a[k].ts||0) < cutoff) delete a[k]; });
      DB.set('active', a);
    },
    async list(){
      if(CONFIG.USE_POCKETBASE){
        await pbLoad;
        try{
          const cutoff = now() - CONFIG.ACTIVE_TTL_MS;
          return await pb.collection(CONFIG.COL.ACTIVE).getFullList({ filter:`ts >= ${cutoff}`, sort:'-ts' });
        }catch(e){ return []; }
      }
      const a = DB.get('active', {});
      const cutoff = now() - CONFIG.ACTIVE_TTL_MS;
      return Object.values(a).filter(x => (x.ts||0) > cutoff);
    }
  }
};

  const muniEl = document.getElementById('f_muni_' + formId);

async function doRegister(){
  if(state.busy) return;
  const g = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
  const nombre = g('rg_nombre'), apellido = g('rg_apellido'), ci = g('rg_ci'), tel = g('rg_tel'), rol = g('rg_rol');
  const pwEl = document.getElementById('rg_pw');
  const pw = pwEl ? pwEl.value : '';
  if(!nombre || !apellido || !ci || !tel || !rol || !pw) return err('Complete todos los campos obligatorios.');
  if(nombre.length < 3) return err('Nombre muy corto.');
  if(apellido.length < 3) return err('Apellido muy corto.');
  if(!isValidCI(ci)) return err('Cédula inválida.');
  if(!isValidPhone(tel)) return err('Teléfono inválido (0414-1234567).');
  if(pw.length < 8) return err('La contraseña debe tener al menos 8 caracteres.');
  const photo = photoCache['rg_user'];
  if(!photo || !photo.dataUrl) return err('Debe cargar una fotografía de perfil.');
  
  if(state.user && !Permissions.canCreateRole(state.user, rol)) return err('No autorizado.');
  
  let estado = '', municipio = '', es_aprobador = false;
  if(rol === Roles.CPR || rol === Roles.CPM){ estado = g('rg_estado'); if(!estado) return err('Seleccione el estado.'); }
  if(rol === Roles.CPM){ municipio = g('rg_municipio'); if(!municipio) return err('Seleccione el municipio.'); }
  if(rol === Roles.NACIONAL && Permissions.isMaster(state.user)){
    const chk = document.getElementById('rg_aprobador');
    es_aprobador = !!(chk && chk.checked);
  }
  state.busy = true;
  try{
    const payload = { nombre, apellido, ci, telefono:tel, rol, estado, municipio, password:pw, foto: photo.dataUrl, es_aprobador };
    if(CONFIG.USE_POCKETBASE){
      const blob = await (await fetch(photo.dataUrl)).blob();
      payload._fotoFile = new File([blob], 'avatar_' + normCI(ci).replace('-','') + '.jpg', { type:'image/jpeg' });
    }
    await Api.register(payload, state.user);
    clearPhotoCache('rg_');
    showPoliticas();
  }catch(e){ err(e.message || 'Error al registrar.'); }
  finally{ state.busy = false; }
}

    tabs = [

    ];

      const pend = await pendingCountForTabs();
      tabs = [
        ['inicio','Inicio'],
        ['cargar','Cargar Lotes'],
        ['aprobaciones','Aprobaciones' + (pend ? '|' + pend : '')],
        ['reporte','Reportes'],
        ['usuarios','Usuarios'],
        ['activos','Activos'],
        ['historial','Historial'],
        ['reglamento','📖 Reglamento']
      ];
    } else {
      tabs = [
        ['inicio','Inicio'],
        ['cargar','Cargar Lotes'],
        ['reporte','Reportes'],
        ['usuarios','Usuarios'],
        ['activos','Activos'],
        ['historial','Historial'],
        ['reglamento','📖 Reglamento']
      ];
    }
  } else if(u.rol === Roles.CPR){
    tabs = [['cargar','Cargar CPR'],['municipios','Estado'],['reglamento','📖 Reglamento']];
  } else {
    tabs = [['cargar','Cargar CPM'],['ver','Ver Registros'],['reglamento','📖 Reglamento']];

  if(!valid.includes(state.tab)) state.tab = valid[0];
  wrap.innerHTML = '<div class="tabs">' +
    tabs.map(([k,l]) => {

      const key = parts[0], count = parts[1];
      return '<button type="button" class="tab ' + (state.tab===key?'active':'') + '" data-action="changeTab" data-tab="' + esc(key) + '">' +
        esc(l) + (count ? '<span class="count">' + esc(count) + '</span>' : '') +
      '</button>';
    }).join('') +

    if(u.rol === Roles.MASTER || u.rol === Roles.NACIONAL){
      if(state.tab === 'inicio') c.innerHTML = await inicioView();
      else if(state.tab === 'cargar') c.innerHTML = nacionalCargar();
      else if(state.tab === 'aprobaciones') c.innerHTML = await aprobacionesView();
      else if(state.tab === 'reporte') c.innerHTML = await nacionalReporte();
      else if(state.tab === 'usuarios') c.innerHTML = await usuariosView();
      else if(state.tab === 'activos'){ c.innerHTML = await activosView(); scheduleActivosRefresh(); }
      else if(state.tab === 'historial') c.innerHTML = await historialView();
    } else if(u.rol === Roles.CPR){
      if(state.tab === 'cargar') c.innerHTML = cprCargar();
      else if(state.tab === 'municipios') c.innerHTML = await cprMunicipiosReadOnly();
    } else {
      if(state.tab === 'ver') c.innerHTML = await cpmVerRegistros();
      else c.innerHTML = cpmCargar();
    }
    if(state.tab === 'cargar') renderFormZone();
  }catch(e){
    if(isAuthError(e)){
      await logout();
      err('Sesión expirada. Vuelva a iniciar sesión.');
      return;
    }
    c.innerHTML = '<div class="card"><b style="color:var(--danger)">Error:</b> ' + esc(e.message || String(e)) + '</div>';
  }
}

let activosTimer = null;
function scheduleActivosRefresh(){
  if(activosTimer) clearTimeout(activosTimer);
  activosTimer = setTimeout(async () => {
    activosTimer = null;
    if(state.tab === 'activos'){
      const c = document.getElementById('content');
      if(c) c.innerHTML = await activosView();
      scheduleActivosRefresh();
    }
  }, 4000);
}

function renderFormZone(){
  const zone = document.getElementById('formZone');
  if(!zone) return;
  const u = state.user;
  let tipo = null, estadoPre = '', municipioPre = '', bloquearEstado = false, bloquearMunicipio = false;
  if(u.rol === Roles.CPR){
    if(!state.batchTipo){ zone.innerHTML = ''; return; }
    tipo = 'CPR'; estadoPre = u.estado || ''; bloquearEstado = true;
  } else if(u.rol === Roles.CPM){
    if(!state.batchTipo){ zone.innerHTML = ''; return; }
    tipo = 'CPM'; estadoPre = u.estado || ''; municipioPre = u.municipio || '';
    bloquearEstado = true; bloquearMunicipio = true;
  } else { tipo = state.batchTipo; }
  if(!tipo){ zone.innerHTML = ''; return; }
  const count = state.batchCount || 0;
  if(count >= CONFIG.MAX_BATCH){
    zone.innerHTML = '<div class="success-box"><b style="color:var(--accent);font-size:16px">✅ Lote Completado (' + CONFIG.MAX_BATCH + ' miembros).</b>' +
      '<div style="margin-top:14px"><button class="btn ok" data-action="resetBatch">Iniciar Nuevo Lote</button></div></div>';
    return;
  }
  const tag = '<div class="batch-tag">Miembro ' + (count + 1) + ' de ' + CONFIG.MAX_BATCH + ' · Mínimo ' + CONFIG.MIN_BATCH + ' requerido</div>';
  zone.innerHTML = tag + formularioHTML(tipo, estadoPre, municipioPre, bloquearEstado, bloquearMunicipio);
  const estSel = zone.querySelector('[id^="f_estado_"]');
  if(estSel) updateMepPreview(estSel.id.replace('f_estado_',''));
}

async function guardarFormulario(tipo, id){
  if(state.busy) return;
  if((state.batchCount || 0) >= CONFIG.MAX_BATCH) return err('Límite de lote alcanzado.');
  const v = k => { const el = document.getElementById('f_' + k + '_' + id); return el ? el.value.trim() : ''; };
  const data = {
    tipo, nombre: v('nombre'), ci: v('ci'), sexo: v('sexo'), lugar_nac: v('lugar_nac'), fecha_nac: v('fecha_nac'),
    estado_civil: v('estado_civil'), profesion: v('profesion'), oficio: v('oficio'), estado: v('estado'),
    municipio: v('muni'), parroquia: v('parroquia'), sector: v('sector'), residencia: v('residencia'),
    punto_ref: v('punto_ref'), telefono: v('telefono'), email: v('email'), trabajo: v('trabajo'),
    empresa: v('empresa'), nivel_inst: v('nivel_inst'), area: v('area'), especializacion: v('especializacion'),
    sector_activa: v('sector_activa'), centro_vot: v('centro_vot'), codigo: v('codigo'), mesa: v('mesa')
  };
  if(!data.nombre || !data.ci || !data.sexo || !data.lugar_nac || !data.fecha_nac || !data.estado_civil || !data.profesion || !data.oficio) return err('Complete los datos personales.');
  if(!data.estado || !data.municipio || !data.parroquia || !data.sector || !data.residencia || !data.punto_ref) return err('Complete la localización.');
  if(!data.telefono) return err('Ingrese el número de teléfono.');
  if(!isValidCI(data.ci)) return err('Cédula de identidad inválida.');
  if(!isValidPhone(data.telefono)) return err('Teléfono inválido (formato 0414-1234567).');
  if(data.email && !isValidEmail(data.email)) return err('Correo electrónico inválido.');
  if(!data.nivel_inst || !data.sector_activa) return err('Complete nivel de instrucción y sector donde activa.');
  if(!data.centro_vot) return err('Indique el centro de votación.');
  if(data.fecha_nac){
    const d = new Date(data.fecha_nac);
    const min = new Date('1900-01-01');
    const hoy = new Date();
    if(isNaN(d.getTime()) || d < min || d > hoy) return err('Fecha de nacimiento inválida.');
  }
  const photo = photoCache[id];
  if(!photo || !photo.dataUrl) return err('Debe cargar la fotografía tipo carnet.');
  state.busy = true;
  try{
    if(await Api.existsCI(data.ci)) throw new Error('Ya existe un registro con esta cédula de identidad.');
    
    let numero = null;
    for(let i=0; i<CONFIG.MAX_MEP_RETRY; i++){
      const candidate = Api.nextMepNumber(data.estado, data.municipio);
      const taken = await Api.existsNumero(candidate);
      if(!taken){ numero = candidate; break; }
    }
    if(!numero) numero = mepRandomSuffix();
    
    data.numero = numero;
    data.tipo_original = tipo;
    data.foto = photo.dataUrl;
    data.aprobacion = APROBACION.PENDIENTE;
    data.aprobado_por = '';
    data.aprobado_por_nombre = '';
    data.aprobado_en = 0;
    data.rechazado_motivo = '';
    
    if(CONFIG.USE_POCKETBASE){
      const blob = await (await fetch(photo.dataUrl)).blob();
      data._file = new File([blob], 'militante_' + normCI(data.ci).replace('-','') + '.jpg', { type:'image/jpeg' });
      delete data.foto;
      await Api.saveRecord(data);
    } else { await Api.saveRecord(data); }
    
    delete photoCache[id];
    state.batchCount = (state.batchCount || 0) + 1;
    mostrarExitoRegistro(tipo);
  }catch(e){
    if(isAuthError(e)){ await logout(); return err('Sesión expirada.'); }
    err(e.message || 'Error al guardar el registro.');
  }
  finally{ state.busy = false; }
}

function mostrarExitoRegistro(tipo){
  const zone = document.getElementById('formZone');
  if(!zone) return;
  const count = state.batchCount;
  if(count >= CONFIG.MAX_BATCH){
    zone.innerHTML = '<div class="success-box"><b style="color:var(--accent);font-size:16px">✅ Límite máximo de lote alcanzado (' + CONFIG.MAX_BATCH + ').</b>' +
      '<p class="small" style="margin-top:6px">Los registros quedan pendientes de aprobación.</p>' +
      '<div style="margin-top:14px"><button class="btn ok" data-action="resetBatch">Iniciar Nuevo Lote</button></div></div>';
    clearPhotoCache('id_');
    return;
  }
  const canFinish = count >= CONFIG.MIN_BATCH;
  const hint = canFinish ? '' : '<p class="small" style="margin-top:8px;color:var(--text-muted)">Debe cargar al menos ' + CONFIG.MIN_BATCH + ' militantes para cerrar el lote.</p>';
  zone.innerHTML = '<div class="success-box">' +
    '<b style="color:var(--accent);font-size:16px">✅ Registro guardado (' + count + ' de ' + CONFIG.MAX_BATCH + ')</b>' + hint +
    '<p class="small" style="margin-top:6px">Pendiente de aprobación por el nivel Nacional designado.</p>' +
    '<div style="margin-top:16px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">' +
      '<button class="btn ok" data-action="nuevoRegistro">+ Siguiente Militante</button>' +
      (canFinish ? '<button class="btn sec" data-action="finalizarCarga">Finalizar Lote Actual</button>' : '') +
    '</div></div>';
}

function aprobBadge(estado){
  estado = estado || APROBACION.PENDIENTE;

  if(estado === APROBACION.RECHAZADO) return '<span class="badge red">Rechazado</span>';
  return '<span class="badge warn">Pendiente</span>';
}

async function toggleCollapseRO(idx){
  const el = document.getElementById('cb_' + idx);
  if(!el) return;
  if(el.classList.contains('hidden')){
    const municipios = ESTADOS[state.user.estado] || [];
    const m = municipios[Number(idx)];
    if(!m) return;
    const rows = await Api.listRecords({ estado: state.user.estado, municipio: m });
    el.innerHTML = rows.length
      ? '<div class="table-responsive" style="margin-top:0"><table style="margin-top:0"><thead><tr><th>Foto</th><th>Nombres y Apellidos</th><th>C.I.</th><th>Teléfono</th><th>N° MEP</th><th>Aprobación</th></tr></thead><tbody>' +
        rows.map(r => {
          const imgSrc = safeImgSrc(r.foto || '');
          return '<tr><td>' + (imgSrc ? '<img src="' + esc(imgSrc) + '" style="width:34px;height:34px;border-radius:50%;object-fit:cover;border:2px solid var(--accent)" alt="">' : '<span class="small">—</span>') + '</td>' +
            '<td>' + esc(r.nombre) + '</td><td>' + esc(r.ci) + '</td><td>' + esc(r.telefono||'') + '</td><td class="small">' + esc(r.numero||'') + '</td>' +
            '<td>' + aprobBadge(r.aprobacion) + '</td></tr>';
        }).join('') + '</tbody></table></div>'
      : '<div class="small">Sin registros en este municipio.</div>';
    el.classList.remove('hidden');
  } else el.classList.add('hidden');
}

/* ============================================================

============================================================ */
async function aprobacionesView(){
  if(!Permissions.canApprove(state.user)){
    return '<div class="card"><h2>Aprobaciones</h2><p class="small" style="margin-top:8px">No tenés permisos para aprobar registros.</p></div>';
  }
  const all = await Api.listRecords({});
  const pendientes = all.filter(r => (r.aprobacion||APROBACION.PENDIENTE) === APROBACION.PENDIENTE);
  const aprobados = all.filter(r => r.aprobacion === APROBACION.APROBADO);
  const rechazados = all.filter(r => r.aprobacion === APROBACION.RECHAZADO);
  const filter = state.approvalFilter || 'pendiente';
  let list = filter === 'aprobado' ? aprobados : filter === 'rechazado' ? rechazados : filter === 'todos' ? all : pendientes;
  
  if(state.approvalEstado) list = list.filter(r => r.estado === state.approvalEstado);
  if(state.approvalMunicipio) list = list.filter(r => r.municipio === state.approvalMunicipio);

  const estadosOpts = '<option value="">Todos los estados</option>' +
    Object.keys(ESTADOS).map(e => '<option value="'+esc(e)+'"'+(e===state.approvalEstado?' selected':'')+'>'+esc(e)+'</option>').join('');
  const muniList = state.approvalEstado ? (ESTADOS[state.approvalEstado]||[]) : [];
  const muniOpts = '<option value="">Todos los municipios</option>' +
    muniList.map(m => '<option value="'+esc(m)+'"'+(m===state.approvalMunicipio?' selected':'')+'>'+esc(m)+'</option>').join('');

  const rows = list.length ? list.map(r => {
    const imgSrc = safeImgSrc(r.foto || '');
    const actions = filter === 'pendiente'
      ? '<button class="btn ok" style="padding:6px 10px;font-size:11.5px" data-action="aprobarRegistro" data-id="' + esc(r.id) + '">✓ Aprobar</button> ' +
        '<button class="btn danger" style="padding:6px 10px;font-size:11.5px" data-action="rechazarRegistro" data-id="' + esc(r.id) + '">✕ Rechazar</button>'
      : '<button class="btn sec" style="padding:6px 10px;font-size:11.5px" data-action="verPlanillaDetalle" data-estado="' + esc(r.estado) + '" data-municipio="' + esc(r.municipio) + '" data-ci="' + esc(r.ci) + '">Ver</button>';
    return '<tr>' +
      '<td>' + (imgSrc ? '<img src="' + esc(imgSrc) + '" style="width:38px;height:38px;border-radius:50%;object-fit:cover;border:2px solid var(--accent)" alt="">' : '<span class="small">—</span>') + '</td>' +
      '<td>' + esc(r.nombre) + '</td><td>' + esc(r.ci) + '</td>' +
      '<td>' + esc(r.tipo_original || r.tipo) + '</td>' +
      '<td>' + esc(r.estado) + ' / ' + esc(r.municipio) + '</td>' +
      '<td>' + aprobBadge(r.aprobacion) + '</td>' +
      '<td>' + actions + '</td></tr>';
  }).join('') : '<tr><td colspan="7">Sin registros para este filtro.</td></tr>';

  return '<div class="card"><h2>Aprobación de Registros</h2>' +
    '<p class="small" style="margin-top:6px">Revisá y aprobá/rechazá los registros cargados por CPR y CPM.</p>' +
    '<div class="tabs section" style="margin-top:14px">' +
      '<button type="button" class="tab ' + (filter==='pendiente'?'active':'') + '" data-action="setApprovalFilter" data-filtro="pendiente">Pendientes (' + pendientes.length + ')</button>' +
      '<button type="button" class="tab ' + (filter==='aprobado'?'active':'') + '" data-action="setApprovalFilter" data-filtro="aprobado">Aprobados (' + aprobados.length + ')</button>' +
      '<button type="button" class="tab ' + (filter==='rechazado'?'active':'') + '" data-action="setApprovalFilter" data-filtro="rechazado">Rechazados (' + rechazados.length + ')</button>' +
      '<button type="button" class="tab ' + (filter==='todos'?'active':'') + '" data-action="setApprovalFilter" data-filtro="todos">Todos (' + all.length + ')</button>' +
    '</div>' +
    '<div class="grid section" style="gap:12px">' +
      '<div><label>Estado</label><select id="ap_estado" data-change="aprobFilterEstado">' + estadosOpts + '</select></div>' +
      '<div><label>Municipio</label><select id="ap_muni" data-change="aprobFilterMunicipio">' + muniOpts + '</select></div>' +
    '</div>' +
    '<div class="table-responsive" style="margin-top:14px"><table>' +
      '<thead><tr><th>Foto</th><th>Nombres y Apellidos</th><th>C.I.</th><th>Tipo</th><th>Estado/Municipio</th><th>Estatus</th><th>Acciones</th></tr></thead>' +
      '<tbody>' + rows + '</tbody></table></div></div>';
}

function setApprovalFilter(f){ state.approvalFilter = f; renderTabContent(); }

async function aprobarRegistro(id){
  if(!Permissions.canApprove(state.user)) return err('No autorizado.');
  if(!confirm('¿Confirmás aprobar este registro?')) return;
  try{
    await Api.aprobarRecord(state.user, id, '');
    ok('Registro aprobado.');
    renderTabs(); renderTabContent();
  }catch(e){ err(e.message); }
}

function rechazarRegistro(id){
  if(!Permissions.canApprove(state.user)) return err('No autorizado.');
  UI.modal(
    '<h2>Rechazar Registro</h2>' +
    '<p class="small" style="margin-top:6px">Indicá el motivo del rechazo. El CPR/CPM podrá verlo y corregir.</p>' +
    '<label style="margin-top:16px">Motivo (mínimo 5 caracteres)</label>' +
    '<textarea id="rj_motivo" rows="4" maxlength="300" placeholder="Ej: Cédula no coincide con la foto..."></textarea>' +
    '<div style="margin-top:20px;display:flex;gap:10px;justify-content:flex-end">' +
      '<button class="btn sec" data-action="closeModal">Cancelar</button>' +
      '<button class="btn danger" data-action="confirmarRechazo" data-id="' + esc(id) + '">Rechazar</button>' +
    '</div>'
  );
}

async function confirmarRechazo(id){
  const el = document.getElementById('rj_motivo');
  const motivo = el ? el.value.trim() : '';
  if(motivo.length < 5) return err('El motivo debe tener al menos 5 caracteres.');
  try{
    await Api.rechazarRecord(state.user, id, motivo);
    UI.closeModal();
    ok('Registro rechazado.');
    renderTabs(); renderTabContent();
  }catch(e){ err(e.message); }
}
